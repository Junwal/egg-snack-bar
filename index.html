/* 초당 서빙 수 — 골드·경험치가 같은 분모를 쓴다.
   경험치만 고정값이면 규모가 커져도 해금이 안 열린다(실측: 80스텝에 메뉴 8종) */
function serveRate(){
  if(!menus().length) return 0;
  /* ⚠ 사이클 식은 이 게임에 하나만 있어야 한다.
     예전엔 여기서 (주문+조리)만 세는 짧은 식을 따로 갖고 있었다. 알바몬이 실제로
     쓰는 시간의 절반 이상은 카운터↔화구↔테이블 왕복인데 그게 빠져 있었고,
     게다가 실제 이동은 walkMul 이 2.4 에서 막혀 더 안 줄어드는 반면
     이 식은 servMul 로 무한히 짧아졌다. 그래서 레벨이 오를수록 이론이 실측을
     앞질렀다 — 실측 대비 Lv3 71% → Lv26 36%. HUD 의 '초당 골드'와
     오프라인 보상이 둘 다 이 식을 쓰므로, 방치가 실제 플레이보다 2.8배
     이득인 상태였다. 이제 손님 유입·이동까지 포함한 cycleSec() 하나만 쓴다
     (실측 대조 92~121%). */
  return (staff.length||1)/cycleSec();
}
/* 초당 호감도 — 납품분 + 착석분. 매장에서 실제로 도는 것과 같은 식이라야
   자리 비웠다 와도 레벨이 튀거나 밀리지 않는다 */
function fameRate(){
  if(!menus().length) return 0;
  const seatOn = Math.min(seatMax(), serveRate()*SEAT_SEC);
  return FAME_PER_SERVE(menus().length) * (serveRate() + seatOn*SEAT_XP());
}
/* 실제로 팔리는 것의 평균가.
   메뉴 목록의 산술평균을 쓰던 동안 이론이 실측을 Lv30 기준 1.8배 앞질렀다 —
   상위 티어를 개발해 두기만 해도 평균이 뛰는데, 손님이 조르는 티어는
   fameBand() 분포와 계열별 해금 상한(capTier)에서 잘리기 때문이다.
   주문이 실제로 분포하는 대로 가중해야 이론과 실측이 같은 것을 센다 */
function avgSale(){
  const w=fameBand(); let sum=0, n=0;
  const basic = S.made[BASIC.id] ? menuPrice(BASIC) : 0;
  for(const k of LK){
    if(!S.pets[k]) continue;
    const cap = capTier(k);
    for(let t=0;t<w.length;t++){
      if(!w[t]) continue;
      const ms = MENU.filter(m=>m.line===k && m.tier2===Math.min(t,cap) && S.made[m.id]);
      sum += w[t] * (ms.length ? ms.reduce((a,m)=>a+menuPrice(m),0)/ms.length : basic);
      n   += w[t];
    }
  }
  return n ? sum/n : basic;
}
function offlineRate(){
  if(!menus().length) return 0;
  const avg=avgSale();
  const seatOn = Math.min(seatMax(), serveRate()*SEAT_SEC);     // 정상 상태 착석 인원
  return avg*serveRate()*(1 + tipRate()*0.3) + seatOn*avg*SEAT_PCT();
}

/* ── 사냥터 ── */
const josa = (w,a,b)=>{ const c=w.charCodeAt(w.length-1);
  return w + ((c>=0xAC00&&c<=0xD7A3 && (c-0xAC00)%28) ? a : b) };   // 받침 유무
/* 그 재료를 '갈 수 있는 곳' 중 기대 획득량이 가장 큰 판. 같으면 낮은 번호(하트·시간이 싸다) */
function bestFor(k,g){
  let best=0, bv=-1;
  for(let s=1;s<=50;s++){
    if(!huntOpen(s)) continue;
    const it=stageLoot(s).find(x=>x.k===k && x.g===g); if(!it) continue;
    const v=(it.min+it.max)/2; if(v>bv){ bv=v; best=s }
  }
  return best;
}
let huntSel = null;                     // 목록에서 고른 판 — '확인'을 눌러야 반영된다
function openHunt(fk, fg){
  const maxS = huntMax(), cur = Math.max(1,Math.min(50,S.huntPick||maxS||1));
  const hit = s => fk!=null && huntInfo(s).lines.includes(fk) && huntInfo(s).gMax>=fg;
  huntSel = (fk!=null ? (bestFor(fk,fg)||null) : null);
  let h=`<p class="big">사냥터</p>`;
  h += fk!=null
    ? `<p class="sub"><b style="color:${GCOL[fg]}">${MAT[fk][fg]}</b>가 나오는 사냥터 · <b>가장 많이 나오는 곳</b>을 골라 뒀습니다
       ${[...Array(maxS+1).keys()].slice(1).some(hit)?'':`<br><span style="font-size:11.5px;color:#ffb454">아직 갈 수 있는 곳엔 없어요 · 알바몬 레벨을 올리세요</span>`}</p>`
    : `<p class="sub">지금 갈 수 있는 곳 <b>1 ~ ${maxS}</b> · <b style="color:#ff8fa0">실패할 때만 하트 소모</b></p>`;
  h += `<div class="stlist scr">`;
  /* 재료를 눌러 들어왔으면 그 재료가 나오는 곳만 남긴다. 잠긴 곳도 같이 —
     "어디까지 가면 나오는지"가 보여야 알바몬을 왜 키우는지가 읽힌다 */
  const list = fk!=null ? [...Array(51).keys()].slice(1).filter(hit) : [...Array(51).keys()].slice(1);
  if(fk!=null && !list.length) h += `<div class="card empty">아직 이 재료가 나오는 사냥터가 없습니다</div>`;
  for(const s of list){
    const info=huntInfo(s), lock=!huntOpen(s);
    const loot=stageLoot(s).filter(x=>x.max>0)
      .sort((a,b)=>((b.k===fk&&b.g===fg)-(a.k===fk&&a.g===fg)));
    const on = (huntSel!=null ? s===huntSel : s===cur);
    h+=`<div class="strow ${lock?'lock':''} ${on?'sel':''}" data-st="${s}" ${lock?'':`onclick="tapHunt(${s})"`}>
      <div class="sth">
        <span class="stno">${s}</span>
        <span class="stnm">${info.name}</span>
        <span class="stpets">${info.lines.map(k=>PETPAL(k,26,'idle')).join('')}</span>
      </div>
      ${lock?`<div class="stlock">🔒 ${huntLock(s)}</div>`:''}
      <div class="lootrail scr">${loot.map(x=>`<span class="lcd sm ${fk===x.k&&fg===x.g?'hit':''}">
        <i style="color:${GCOL[x.g]}">${GRADE[x.g]}</i>
        <em>${MATIC[x.k][x.g]}</em><b>${MAT[x.k][x.g]}</b>
        <u>${x.min===x.max?x.min:x.min+'~'+x.max}</u></span>`).join('')}</div>
    </div>`;
  }
  h+=`</div><div id="huntcta"></div>`;
  $('sheet').innerHTML=h; $('ov').classList.add('on'); document.body.classList.add('ovon');
  huntCTA();
  /* 미리 골라 둔 판(또는 현재 판)으로 스크롤 */
  const tgt=$('sheet').querySelector(`.strow[data-st="${huntSel!=null?huntSel:cur}"]`)
         || $('sheet').querySelector('.strow:not(.lock)');
  if(tgt) setTimeout(()=>tgt.scrollIntoView({block:'center'}),40);
}
/* 같은 판을 다시 누르면 선택이 풀린다 — 잘못 눌렀을 때 되돌릴 길이 있어야 한다 */

/* ══ 사냥터 = 머지 퍼즐 ════════════════════════════════════════════
   puzzle.html 을 전체화면 iframe 으로 띄우고 결과만 postMessage 로 받는다.
   한 파일로 합치지 않은 이유: 두 앱이 S·save·load·ovClose·render 같은 전역을
   같은 이름으로 쓰고 DOM id 도 겹친다. 섞으면 조용히 서로를 덮어쓴다. */
let running = null;                                   // 진행 중인 사냥터 번호

/* 퍼즐에 넘길 알바몬 레벨.
   기준은 그 사냥터의 권장 레벨이고, 내 알바몬이 그보다 높으면 최대 +3까지 얹힌다
   — "레벨을 올리면 낮은 사냥터가 쉬워진다"가 성립해야 성장에 이유가 생긴다 */
const REC10={b:7,r:7,g:6,y:6}, ROFF={b:0,r:1,g:2,y:3};
const REC_LOW=[null,{b:1},{b:1},{b:2},{b:3,r:1},{b:4,r:2},{b:5,r:4},
  {b:6,r:5,g:3},{b:6,r:6,g:5},{b:7,r:6,g:6,y:4},{b:7,r:7,g:6,y:6}];
function recLv(st, c){
  if(st<=10) return (REC_LOW[st]||{})[c] || 0;
  const every = Math.min(8, 3+Math.floor((st-10)/100));
  const acc = Math.floor((st-11+1)/3);                // S510 미만은 간격 3
  return REC10[c] + acc + (Math.floor((st-10+ROFF[c])/every) - Math.floor((st-10)/every));
}
function petsParam(st){
  return LK.map(k=>{
    if(!S.pets[k]) return null;
    const base = recLv(st,k); if(base<=0) return null;
    /* 보너스는 +3 고정. 예전엔 min(3, 내레벨−스테이지) 라서 huntOpen 조건상
       항상 pets==st 인 '최고 판'만 보너스가 0이 됐고, 사다리를 깊게 만들자
       마지막 3판만 목표가 2단 더 멀어지는 절벽이 생겼다(실측 드롭 42 → 160).
       이제 사다리 밑단은 어느 판에서든 0 — 난이도 축은 maxStep 하나로 순수해진다 */
    return k+':'+(base + 3);
  }).filter(Boolean).join(',') || 'b:1';
}
function pickHunt(s){ S.huntPick=s; S.seen[s]=1; huntSel=null; save(); ovClose(); bagTab='hunt'; devOn=false; go('bag') }
const newHunt = () => { for(let s=1;s<=50;s++) if(huntOpen(s) && !S.seen[s]) return true; return false };
const huntMax = () => { let m=0; for(let s=1;s<=50;s++){ if(huntOpen(s)) m=s; else break } return m };
function hunt(s){
  if(!huntOpen(s)) return toast(huntLock(s));
  if(S.hearts<1) return toast('하트가 없어 입장할 수 없습니다');
  running = s;
  BGM.duck(true);
  ovClose(); SFX('go');
  /* 규칙 안내는 셸이 판단한다. 퍼즐 쪽 localStorage 플래그에 맡기면
     세이브를 지워도 안 뜨거나, 반대로 브라우저를 바꾸면 또 뜬다 */
  S.hrun = (S.hrun||0) + 1;
  /* 규칙 안내는 첫 판에만. 3회로 뒀더니 '들어갈 때마다 뜬다'로 읽혔다 —
     한 번 본 규칙을 세 번 보여주는 건 안내가 아니라 방해다.
     다시 보고 싶으면 퍼즐 안 설정(⚙) → '사냥터 규칙'에서 언제든 열린다 */
  const showGuide = S.hrun <= 1 ? 1 : 0;
  save();
  const info = huntInfo(s);
  const gm = GRADE[info.gMax];
  const lines = info.lines.map(k=>MATIC[k][info.gMax]+MAT[k][info.gMax]).join(' ');
  const wrap = document.createElement('div'); wrap.id='puz';
  wrap.innerHTML = '<div id="puzload">'+info.name+'로 가는 중…</div>';
  const f = document.createElement('iframe');
  /* 사냥터에 넘기는 값. 파일 3개로 돌릴 때는 해시로, 단일 파일 빌드에서는
     srcdoc 안에 window.__EMBED 로 심어서 넘긴다 — 폰에서 파일을 따로 못 두기 때문 */
  const P = { embed:'1', stage:String(s), guide:String(showGuide),
    pets: petsParam(s), gem:String(S.gem), name:'S'+s+' '+info.name,
    loot:String(info.yield_), loottxt: gm+' '+lines,
    loot2: JSON.stringify(stageLoot(s).map(x=>
      ({e:MATIC[x.k][x.g], n:MAT[x.k][x.g], g:GRADE[x.g], c:GCOL[x.g], a:x.min, b:x.max}))),
    items: JSON.stringify(S.items||{}) };
  if(window.__PUZ_HTML){
    f.srcdoc = window.__PUZ_HTML.replace('<head>',
      '<head><script>window.__EMBED='+JSON.stringify(P).replace(/</g,'\\u003c')+'<\/script>');
  } else {
    f.src = 'puzzle.html#' + Object.entries(P)
      .map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  }
  f.onload = ()=>requestAnimationFrame(()=>wrap.classList.add('ready'));
  wrap.appendChild(f); document.body.appendChild(wrap);
  requestAnimationFrame(()=>{ wrap.classList.add('on'); document.body.classList.add('inpuz') });
  setTimeout(()=>wrap.classList.add('ready'), 2500);      // onload 가 안 와도 갇히지 않게
}

/* 클리어 보상 — 기본 산출 + 납품 성과 보너스 */
/* 보상은 칩마다 독립시행이다. min 이 1 이상인 칩은 반드시 그만큼 들어오고,
   min 이 0인 칩만 '나올 수도 안 나올 수도' 있다 */
function reward(st){
  const got={}; let n=0;
  for(const it of stageLoot(st)){
    const q = it.min + Math.floor(Math.random()*(it.max-it.min+1));
    if(q<=0) continue;
    S.inv[it.k][it.g] += q; S.dexM[it.k+it.g]=1;
    got[it.k+it.g]=(got[it.k+it.g]||0)+q; n+=q;
  }
  /* 첫 클리어 보너스 — 다이아를 플레이로 얻는 유일한 경로.
     이게 없으면 상점 아이템이 '결제해야만 쓰는 것'이 되어 사냥 장비라는 프레이밍이 깨진다.
     50판 × 2 = 100 다이아 ≒ 아이템 40~50개 */
  /* best 는 1에서 시작하므로 첫 판이 '이미 깬 것'으로 잡힌다. 클리어 기록을 따로 둔다 */
  let gem=0;
  S.clr = S.clr || {};
  if(!S.clr[st]){ S.clr[st]=1; gem = 2 + (st%10===0 ? 8 : 0); S.gem += gem; }
  /* 사냥 한 판 ≈ 3분. 그중 90초분을 호감도로 돌려준다 —
     "갔다 왔더니 매장이 컸다"가 있어야 사냥이 매장 성장의 일부로 읽힌다 */
  /* 45초분. 90초로 뒀더니 곡선이 사냥 횟수에 너무 매여서
     같은 조건 재시행에 326~361분으로 흔들렸다(하트 병목이 사냥 횟수를 시드마다 크게 바꾼다) */
  S.fame += fameRate()*45 + 8;
  S.best=Math.max(S.best, st);
  petJoin();
  return { got, n, gem };
}

  if(d.items) S.items = Object.assign({del:0,swp:0,rbw:0,up:0,dn:0}, d.items);   // 판에서 쓴 만큼 회수
  closePuzzle();

    const {got,n,gem}=reward(st);                              // 결과 화면은 퍼즐이 이미 보여줬다

    if(S.qDone && S.qDone.dev1) unlockNav('shop');   // 정상 경로는 dev1 완료 · navFallback 이 뒤를 받친다
  }else{
    // 실패·중도이탈 — 로얄매치 규칙대로 하트 1 소모
    if(S.hearts>=HEART_MAX) S.heartAt=now();

      <div class="card" style="font-size:11.5px;color:var(--dim);line-height:1.6">
        알바몬 레벨을 올리면 같은 사냥터에서 더 큰 알이 나와 판이 짧아진다.</div>
      <button class="mbtn" onclick="ovClose();go('pet')">알바몬 레벨 올리기</button>
      <button class="mbtn ghost" onclick="ovClose()">닫기</button>`;
    $('ov').classList.add('on'); document.body.classList.add('ovon');
  }
});

/* 토스트 — 좌상단에 쌓인다. 하단에 띄우면 바텀탭·FAB와 겹쳐서 조작을 가린다 */

}

/* 3장 넘으면 나머지는 접는다 */
function trimToast(){
  const box=$('toastbox'); if(!box) return;
  const old=box.querySelector('.tmore'); if(old) old.remove();
  const list=[...box.children];
  const hid=list.slice(0,Math.max(0,list.length-3));
  list.forEach(e=>e.classList.remove('hide'));
  if(!hid.length) return;
  hid.forEach(e=>e.classList.add('hide'));
  const more=document.createElement('button');
  more.className='tmore'; more.textContent=`＋ ${hid.length}개 더 보기`;
  more.onclick=()=>{ hid.forEach(e=>e.classList.remove('hide')); more.remove() };
  box.insertBefore(more, box.firstChild);
}

/* ── 마당 렌더 ─────────────────────────────────────────────────────
   innerHTML 을 매 프레임 다시 쓰면 노드가 60번/초 재생성돼서
   CSS 애니메이션이 전부 0% 에서 재시작한다 — 말풍선이 opacity 0 에 갇히고
   팔다리 스윙·바운스도 첫 프레임만 반복된다(실측: bub op=0).
   그래서 노드를 재사용하고 바뀐 것만 건드린다 */
const gNodes = new Map(), sNodes = new Map();
let lastGs = null;

function mkEnt(cont, map, key){
  let n = map.get(key);
  if(!n){
    const el = document.createElement('div');
    el.className = 'ent';
    const sp = document.createElement('span'); sp.className='sp';
    el.appendChild(sp); cont.appendChild(el);
    n = { el, sp, bub:null, ring:null, face:'', cls:'', txt:null, bcl:null, rk:null };
    map.set(key, n);
  }
  return n;
}
function setPos(n, e){
  n.el.style.left = (e.x/VW*100)+'%';
  n.el.style.top  = (e.y/VH*100)+'%';
}
function setCls(n, cls){ if(n.cls!==cls){ n.cls=cls; n.el.className=cls } }
function setBub(n, txt, bcl){
  if(n.txt===txt && n.bcl===bcl) return;
  n.txt=txt; n.bcl=bcl;
  if(n.bub){ n.bub.remove(); n.bub=null }
  if(txt){
    const b=document.createElement('div');
    b.className = 'bub'+(bcl?' '+bcl:'');
    b.textContent = txt;
    n.el.insertBefore(b, n.sp);
    n.bub=b;
  }
}

/* ══ 돌발 이벤트 ═════════════════════════════════════════════════
   매장 화면에서만. 동시 1마리. 사냥 중·모달 중에는 스폰하지 않는다.
   방치형에 '지금 눌러야 하는 순간'을 심는 장치 — 놓쳐도 처벌이 아니라 아쉬움에 그쳐야 한다 */
let ev = null, evCool = 60;
const EV = {
  thief: { at:5,  cool:60,  p:0.015 },   // 평균 ≈ 90초
  santa: { at:8,  cool:240, p:0.004 },   // 평균 ≈ 5분
};
const SANTA_CAP = 15;                    // 회당 다이아 상한

function evTick(dt){
  if(ev){ evStep(dt); return }
  if(running!=null || document.body.classList.contains('ovon')) return;
  evCool -= dt; if(evCool>0) return;
  const lv=shopLv();
  const pool=[];
  if(lv>=EV.thief.at) pool.push('thief');
  if(lv>=EV.santa.at) pool.push('santa');
  if(!pool.length) return;
  for(const k of pool) if(Math.random() < EV[k].p*dt*60) return evSpawn(k);
}
function evSpawn(kind){
  const y = ROAD_Y;
  if(kind==='thief'){
    ev = { kind, x:VW+30, y, tx:CNT_X-58, ty:LY.counter+18, st:'come', g:0, t:0, hit:0 };
  }else{
    ev = { kind, x:-30, y, tx:VW+40, ty:y, st:'walk', t:0, got:0 };
  }
  evCool = EV[kind].cool;
}
function evStep(dt){
  const e=ev; e.t+=dt;
  if(e.kind==='thief'){
    if(e.st==='come'){
      const sp = SPD*0.5*dt;                       // 살금살금
      const dx=e.tx-e.x, dy=e.ty-e.y, d=Math.hypot(dx,dy);
      if(d<3){ e.st='steal'; e.x=e.tx; e.y=e.ty }
      else { e.x+=dx/d*sp; e.y+=dy/d*sp }
    }else if(e.st==='steal'){
      e.g += 20*dt;                                // 초당 20 → 5초
      if(e.g>=100){ evThiefWin() }
    }else if(e.st==='flee'){
      e.x += 260*dt; if(e.x>VW+40) ev=null;
    }
  }else{
    const sp = 46*dt;
    e.x += sp;
    if(e.x>e.tx || e.t>12){ evSantaLeave() }
  }
}
function evThiefWin(){
  /* 골드 8% · 상한 3분치 수입. 60초로 뒀더니 실측 146만 골드에서 146밖에 안 뺏겨
     "도둑맞았다"가 체감이 안 됐다. 그래도 8% 상한이 있어 처벌이 되진 않는다 */
  const take = Math.min(Math.floor(S.gold*0.08), Math.floor(offlineRate()*180));
  S.gold = Math.max(0, S.gold-take);
  ev.st='flee'; save(); SFX('err');
  toast(`🥷 도둑에게 <b style="color:#ff8f7a">${G(take)}</b>를 도둑맞았습니다`);
}
function evSantaLeave(){
  if(ev.got) toast(`🎅 산타가 떠났습니다 · ${GEM_SVG} <b>+${ev.got}</b>`);
  ev=null;
}
/* 탭 — 도둑은 게이지를 깎고, 산타는 다이아를 준다 */
function evTap(){
  const e=ev; if(!e) return;
  if(e.kind==='thief'){
    if(e.st!=='steal' && e.st!=='come') return;
    e.g = Math.max(0, e.g-10); e.hit=0.18; SFX('tap'); buzzTiny();
    if(e.st==='steal' && e.g<=0){
      ev=null; S.gem+=1; save(); SFX('hire');
      toast(`🥷 도둑을 쫓아냈습니다! ${GEM_SVG} <b>+1</b>`);
    }
  }else{
    if(e.got>=SANTA_CAP) return;
    e.got++; S.gem++; e.hit=0.18; SFX('coin'); save();
    fx(0, false, e.x, e.y-10, 1, 0, '💎+1');
  }
}
function buzzTiny(){ try{ navigator.vibrate && navigator.vibrate(12) }catch(_){} }

/* 렌더 — 손님과 같은 레이어에 얹는다 */
function paintEvent(){
  const box=$('walkers'); if(!box) return;
  let n=$('event');
  if(!ev){ if(n) n.remove(); return }
  if(!n){ n=document.createElement('div'); n.id='event'; n.className='ent evnt';

  if(n.dataset.k!==ev.kind){
    n.dataset.k=ev.kind;
    n.innerHTML = ev.kind==='thief'
      ? `<div class="evi">🥷</div><div class="evg"><i></i></div>`

  }
  n.style.left=(ev.x/VW*100)+'%'; n.style.top=(ev.y/VH*100)+'%';

    }

function paintYard(){
  if(tab!=='store' || running!=null) return;   // 퍼즐이 떠 있으면 마당은 안 그린다(정산은 계속)
  const gs=$('guests'), ss=$('staffs'), wk=$('walkers'); if(!gs||!ss) return;
  if(gs!==lastGs){ lastGs=gs; gNodes.clear(); sNodes.clear(); gs.innerHTML=''; ss.innerHTML='' }

  /* ── 손님 ── */
  const alive = new Set();
  for(const c of guests){
    const key='g'+c.id; alive.add(key);
    const n = mkEnt(gs, gNodes, key);
    setPos(n, c);
    setCls(n, 'ent guest'+(c.mt>0?' walking':'')+(c.tx<c.x-0.5?' flip':'')
      +(c.st==='sad'?' sadfx':'')+(c.st==='got'?' joyfx':''));
    if(n.face!==c.face){ n.face=c.face; n.sp.innerHTML=PETSVG(c.g.k,30,c.face) }
    const hi = (c.qi!=null && c.qi%2) ? ' hi' : '';      // 줄이 촘촘해 말풍선이 겹친다 → 지그재그
    if(c.st==='sad')            setBub(n, '🥲 '+c.missName, 'bad'+hi);
    else if(c.st==='pend')      setBub(n, c.want.name, hi.trim());
    else if(c.st==='got')       setBub(n, '♥', 'ok'+hi);
    else if(c.chat)             setBub(n, c.chat, 'chat');
    else                        setBub(n, null, null);
  }
  for(const [k,n] of gNodes) if(!alive.has(k)){ n.el.remove(); gNodes.delete(k) }

  /* ── 점원(알바몬) ── */
  const salive = new Set();
  for(const st of staff){
    const key='s'+st.i; salive.add(key);
    const n = mkEnt(ss, sNodes, key);
    setPos(n, st);
    setCls(n, 'ent staff'+(st.mt>0?' walking':'')+(st.tx<st.x-0.5?' flip':'')+(st.st==='sorry'?' cryfx':''));
    const sface = st.st==='sorry' ? 'sad' : st.face;
    if(n.face!==st.line+sface){ n.face=st.line+sface; n.sp.innerHTML=PETPAL(st.line,38,sface) }
    const busy = st.st==='taking' || st.st==='cooking';
    const rk = busy ? (st.st==='cooking'?'🍳':'📝') : (st.st==='waitOven'?'⏳':'');
    if(n.rk!==rk){
      n.rk=rk;
      if(n.ring){ n.ring.remove(); n.ring=null }
      if(rk){ const r=document.createElement('div'); r.className='ring'+(rk==='⏳'?' wait':'');
        r.textContent=rk; n.el.insertBefore(r, n.sp); n.ring=r }
    }
    if(n.ring && busy){

/* ══ 사운드 ══════════════════════════════════════════════════════
   에셋 없이 WebAudio 로 합성한다. 퍼즐(puzzle.html)과 같은 엔진을 쓰되
   매장 쪽 사건에 맞는 음색만 따로 짰다 — 두 씬의 소리가 형제로 들려야 한다.
   BGM 은 빌드 시 base64 로 심는다(window.__BGM). 없으면 조용히 넘어간다 */
const SFX = (function(){
  const KEY='alSnack_sound';
  let ac=null, bus=null, on=true;
  try{ on = localStorage.getItem(KEY)!=='0' }catch(_){}
  function ready(){
    if(ac){ if(ac.state==='suspended') ac.resume().catch(()=>{}); return true }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    try{
      ac=new AC();
      const comp=ac.createDynamicsCompressor();     // 손님이 몰리면 음이 겹쳐 찢어진다
      comp.threshold.value=-18; comp.ratio.value=8; comp.attack.value=.003;
      bus=ac.createGain(); bus.gain.value=.45;
      bus.connect(comp); comp.connect(ac.destination);
    }catch(_){ return false }
    return true;
  }
  /* 어택 3ms — 0에서 시작하면 스피커에서 딸깍 소리가 같이 나간다 */
  function tone(f,dur,{type='triangle',vol=.5,to=null,delay=0,glide=0}={}){
    if(!on||!ready()) return;
    const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to), t+(glide||dur));
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.003);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+.02);
  }
  function noise(dur,{vol=.25,delay=0,hp=800}={}){
    if(!on||!ready()) return;
    const t=ac.currentTime+delay, n=Math.max(1,Math.floor(ac.sampleRate*dur));
    const buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const src=ac.createBufferSource(); src.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    const g=ac.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(bus); src.start(t);
  }
  /* 슉 — 밴드패스를 훑어 올리는 바람 소리. 강화·해금처럼 "올라간다"는
     사건 전용. 양끝을 sin 창으로 0에 붙여 시작·끝 클릭을 없앤다 */
  function swoosh(dur,{vol=.22,delay=0,f0=520,f1=4600,q=1.1}={}){
    if(!on||!ready()) return;
    const t=ac.currentTime+delay, n=Math.max(1,Math.floor(ac.sampleRate*dur));
    const buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    const src=ac.createBufferSource(); src.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=q;
    f.frequency.setValueAtTime(f0,t);
    f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ac.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(bus); src.start(t); src.stop(t+dur+.02);
  }
  const semi = n => 261.63*Math.pow(2,n/12);
  /* 종 한 알. 기음 + 3배음만 얹는다 — 사각파의 '끾' 없이 '띠'가 난다 */
  const bell = (n,dur,vol,delay=0)=>{
    tone(semi(n), dur, {type:'sine',vol,delay});
    tone(semi(n)*3, dur*.45, {type:'sine',vol:vol*.22,delay:delay+.004});
  };
  /* ── 팔레트는 셋뿐이다 ─────────────────────────────
     찰칵(포스키) · 띠링(돈) · 슉(강화).
     매장의 모든 사건은 이 셋 중 하나의 변주로만 난다. 소리 종류를
     늘리는 대신 같은 소리를 반복시켜야 귀에 붙는다 */
  const A = {
    /* 찰칵 — 포스기 키. 톤이 아니라 짧은 노이즈 딱 + 밑에 깔리는 톡 */
    tap:   ()=>{ noise(.014,{vol:.26,hp:3200});
                 tone(170,.035,{type:'sine',vol:.10,to:120}) },
    open:  ()=>{ noise(.012,{vol:.16,hp:2800});
                 tone(200,.03,{type:'sine',vol:.07,to:150}) },
    /* 띠링 — 판매. 가게에서 가장 자주 나는 소리라 짧고 얕게, 대신 매번 같게 */
    coin:  ()=>{ bell(24,.10,.20); bell(31,.22,.17,.055) },
    /* 착석 정산 — 띠링의 앞 한 알만. 겹쳐도 안 시끄럽게 */
    seat:  ()=>{ bell(31,.11,.09) },
    /* 선호 계열 적중 — 띠링 위에 5도를 하나 더. 띠링~링 */
    happy: ()=>{ bell(36,.18,.11,.11) },
    /* 손님 이탈 — 띠링의 반대. 두 음을 아래로 */
    sad:   ()=>{ bell(19,.10,.11); bell(12,.20,.09,.055) },
    /* 업그레이드 구매 — 슉 한 번 + 착. 돈이 나가므로 띠링은 안 쓴다 */
    buy:   ()=>{ swoosh(.16,{vol:.20,f0:600,f1:3800});
                 tone(150,.09,{type:'sine',vol:.16,delay:.15,to:110});
                 bell(24,.13,.10,.16) },
    /* 메뉴 강화 — 슉슉. 두 번 훑어 올리고 띠링으로 닫는다 */
    star:  ()=>{ swoosh(.17,{vol:.22,f0:500,f1:4200});
                 swoosh(.20,{vol:.24,f0:700,f1:6000,delay:.13});
                 bell(31,.26,.18,.30); bell(38,.20,.08,.32) },
    /* 메뉴 개발 — 조리 완료의 '땡'. 팔레트 밖의 유일한 소리라 이 순간만 특별해진다 */
    make:  ()=>{ bell(24,.44,.24); bell(31,.32,.10,.012); bell(36,.24,.05,.024) },
    /* 매장 레벨업 — 목표축. 슉으로 끌어올리고 띠링 3연타로 닫는다 */
    lvup:  ()=>{ swoosh(.26,{vol:.22,f0:400,f1:6500});
                 [24,28,31,36].forEach((n,k)=> bell(n,.34,.24,.22+k*.075)) },
    unlock:()=>{ swoosh(.22,{vol:.20,f0:450,f1:5200}); bell(31,.26,.18,.20) },
    hire:  ()=>{ swoosh(.18,{vol:.18,f0:600,f1:4400}); bell(28,.14,.16,.16);
                 bell(35,.24,.16,.23) },
    /* 실패 — 찰칵의 저음 버전. 삑 소리를 내지 않는다 */
    err:   ()=>{ noise(.02,{vol:.12,hp:900}); tone(120,.10,{type:'sine',vol:.13,to:85}) },
    /* 사냥터 진입 — 가장 긴 슉. 문이 열리고 빨려 들어가는 느낌 */
    go:    ()=>{ swoosh(.38,{vol:.24,f0:300,f1:5200,q:.8});
                 bell(24,.22,.14,.30) },
  };
  function play(n,a,b){ if(!on) return; const f=A[n]; if(f) try{ f(a,b) }catch(_){} }
  play.isOn=()=>on;
  play.toggle=()=>{ on=!on; try{ localStorage.setItem(KEY,on?'1':'0') }catch(_){}
                    BGM.sync(); if(on) play('open'); return on };
  play.unlock=()=>{ if(on) ready() };
  return play;
})();

/* BGM — 수노에서 받은 트랙을 빌드가 base64 로 심는다. 없으면 아무 일도 안 한다 */
const BGM = (function(){
  let el=null, want=false;
  /* 단일 파일 빌드에서는 base64(window.__BGM), 3파일 배포에서는 옆에 둔
     bgm.mp3 를 그대로 읽는다. URL 로 여는 쪽은 파일을 따로 받는 편이 가볍다 */
  const SRC = () => window.__BGM || 'bgm.mp3';
  function el_(){
    if(el) return el;
    el=new Audio(SRC()); el.loop=true; el.volume=VOL;
    el.addEventListener('error',()=>{ el.dataset.dead='1' });
    return el;
  }
  /* 퍼즐에 들어가면 매장 음악을 끄지 않고 낮춘다. 3분을 무음으로 두면
     허전하고, 그대로 두면 머지 연쇄음을 덮는다 — 덕킹이 답이다 */
  const VOL=0.34, DUCK=0.11;
  let target=VOL, fade=null;
  return {
    has:()=>true,
    start(){ want=true; this.sync() },
    duck(on){ target = on?DUCK:VOL; const a=el_(); if(!a) return;
      clearInterval(fade);
      fade=setInterval(()=>{ const d=target-a.volume;
        if(Math.abs(d)<.012){ a.volume=target; clearInterval(fade); return }
        a.volume=Math.max(0,Math.min(1,a.volume+d*0.25)) }, 40) },
    sync(){ const a=el_(); if(!a) return;
      if(want && SFX.isOn()) a.play().catch(()=>{}); else a.pause(); },
  };
})();
['pointerdown','keydown','touchend'].forEach(ev=>
  addEventListener(ev, ()=>{ SFX.unlock(); BGM.start() }, {once:true,passive:true}));
addEventListener('pointerdown', e=>{
  if(!e.target||!e.target.closest) return;
  if(e.target.closest('#stage')) return;           // 매장 연출 위는 조용히
  if(e.target.closest('button,.tab,.pcard,.dexc,.chipm')) SFX('tap');
}, true);
addEventListener('keydown', e=>{
  if(e.key==='m'||e.key==='M') toast(SFX.toggle()?'🔊 소리 켜짐':'🔇 소리 꺼짐');
});
function toggleSound(){ const v=SFX.toggle(); draw(); toast(v?'🔊 소리 켜짐':'🔇 소리 꺼짐') }

/* ══ 튜토리얼 ════════════════════════════════════════════════════
   스포트라이트는 전부 '상대 좌표'다 — 대상의 getBoundingClientRect() 를
   뷰포트 대비 % 로 바꿔 쓴다. 그래서 폰·태블릿·데스크톱 어디서 열어도,
   회전시켜도, 주소창이 접혔다 펴져도 구멍이 대상 위에 붙어 있는다.
   대상이 사라지면(탭 이동·모달) 그 스텝은 조용히 대기한다 */
/* ══ 가이드 퀘스트 ═══════════════════════════════════════════════
   방치형에서 "지금 누를 것 하나"를 제시하는 단일 채널.
   튜토리얼(옛 TUT)·원하는 메뉴 토스트가 전부 여기로 흡수됐다.
   표시는 둘(상단 배너 + 스포트라이트)이지만 엔진은 하나다 —
   퀘스트에 spot 이 있으면 그 요소를 비추고, 없으면 배너만 뜬다 */
const $q = s => document.querySelector(s);

/* 해금 스케줄은 이미 정본으로 존재한다(PET_AT·UPG.lv·MENU_LV·GUEST.at). 거기서 굽는다 */
const UNLOCKS = (()=>{
  const o=[];
  LK.forEach(k=>{ if(PET_AT[k]>1) o.push({lv:PET_AT[k], what:`${LINE[k].pet} 영입`}) });
  UPG.forEach(u=>{ (u.lvs||[u.lv]).forEach(L=>{ if(L>1) o.push({lv:L, what:`${u.n} 개방`}) }) });
  MENU_LV.forEach((L,i)=>{ if(L>1) o.push({lv:L, what:`${TIER_NAME[i]} 메뉴 개방`}) });
  GUEST.forEach(g=>{ if(g.at>1) o.push({lv:g.at, what:`손님 ${g.n} 방문`}) });
  const seen=new Set();
  return o.sort((a,b)=>a.lv-b.lv).filter(x=>{ const k=x.lv+x.what; if(seen.has(k))return 0; seen.add(k); return 1 });
})();

/* 동적 — 정적 라인이 끝난 뒤. 우선순위 순으로 하나를 뽑는다 */
function pickQuest(){
  const rd = petReady();
  if(rd.length) return { id:'hire:'+rd[0], t:`${LINE[rd[0]].pet} 영입하기`, s:'새 계열 손님이 찾아옵니다',
    tab:'pet', go:()=>go('pet'), spot:()=>tab==='pet'?$q('.pcard .hire'):$q('[data-t="pet"]'),
    hl:'.pcard .hire', done:()=>!!S.pets[rd[0]] };
  /* 손님이 3회 이상 찾은 메뉴만 승격한다 — 1회 스침까지 띄우던 게 토스트가 쌓인 원인이었다 */
  const wish = MENU.filter(m=>!S.made[m.id] && (S.miss[m.id]||0)>=3 && menuUnlocked(m))
    .sort((a,b)=>(canMake(b)-canMake(a))||((S.miss[b.id]||0)-(S.miss[a.id]||0)))[0];
  if(wish) return { id:'make:'+wish.id, t:`${wish.name} 개발하기`, s:`손님이 ${S.miss[wish.id]}번 찾았어요`,
    tab:'bag', go:()=>{ devF=[]; openDev() }, hl:`.mcard[data-mid="${wish.id}"]`,
    done:()=>!!S.made[wish.id] };
  const st = menus().filter(m=>canStar(m))[0];
  if(st) return { id:'star:'+st.id, t:`${st.name} 개선하기`, s:`${STAR_NAME[mStar(st)+1]} 요리가 됩니다`,
    tab:'bag', go:()=>{ devF=[]; openDev() }, hl:`.mcard[data-mid="${st.id}"][data-kind="star"]`,
    done:()=>mStar(st)>0 || !canStar(st) };
  const mk = MENU.filter(m=>!S.made[m.id] && menuUnlocked(m) && canMake(m))[0];
  if(mk) return { id:'make:'+mk.id, t:`${mk.name} 개발하기`, s:'재료가 다 모였어요',
    tab:'bag', go:()=>{ devF=[]; openDev() }, hl:`.mcard[data-mid="${mk.id}"]`,
    done:()=>!!S.made[mk.id] };
  /* 사냥은 5판 단위 마일스톤. 한 판씩 지목하면 1분마다 문구가 바뀌어 성취가 희석된다 */
  const hm = huntMax();
  if(hm>0){
    const goal = Math.min(50, Math.ceil((hm+1)/5)*5);
    const doneN = [...Array(51).keys()].filter(x=>x>=1&&S.clr&&S.clr[x]).length;
    if(!(S.clr&&S.clr[goal]))
      return { id:'hunt:'+goal, t:`사냥터 ${goal} 도달`, s:`${huntInfo(goal).name}까지 · 지금 ${hm}`,
        n:goal, cur:()=>hm, tab:'bag', go:()=>{ bagTab='hunt'; devOn=false; go('bag') },
        hl:'#botcta .mbtn', done:()=>!!(S.clr&&S.clr[goal]) };
  }
  /* 폴백은 '무엇을 사라'가 아니라 '다음 해금까지'다.
     시간의 대부분을 폴백이 차지하는데 거기에 수단을 넣으면 목적이 안 남는다 */
  const nx = UNLOCKS.find(u=>u.lv>shopLv());
  if(nx) return { id:'lv:'+nx.lv, t:`매장 Lv.${nx.lv} 달성`, s:nx.what,
    n:nx.lv, cur:()=>shopLv(), tab:'store', done:()=>shopLv()>=nx.lv };
  return { id:'lv:30', t:'명인이 되세요', s:`매장 Lv.30 까지 · 지금 ${shopLv()}`,
    n:30, cur:()=>shopLv(), tab:'store', done:()=>shopLv()>=30 };
}

let qCur=null, qReady=false, qLast='', qSpotLast='';

/* ══ 퀘스트 하이라이트 ═══════════════════════════════════════════
   칩을 눌러 화면을 옮겨 준 다음이 진짜 문제다 — "그래서 이 중에 어느 거?"
   대상을 셀렉터로 붙잡아 두고, 화면이 다시 그려져도 다시 붙인다.
   한 번 만지면 끈다. 계속 번쩍이면 그 시점부터는 안내가 아니라 잡음이다 */
let hlSel=null, hlTO=null, hlScrolled=false;
function hlPin(sel){
  if(!sel) return;
  hlSel=sel; hlScrolled=false;
  clearTimeout(hlTO);
  hlTO=setTimeout(hlOff, 15000);        // 안 만져도 15초면 스스로 꺼진다
  setTimeout(hlPaint, 40);              // go() 가 그린 뒤에 붙는다
  setTimeout(hlPaint, 220);             // 모달·탭 전환이 늦게 끝나는 경우
}
function hlPaint(){
  document.querySelectorAll('.qhl').forEach(e=>e.classList.remove('qhl'));
  if(!hlSel) return;
  let el=null;
  try{ el = typeof hlSel==='function' ? hlSel() : document.querySelector(hlSel) }catch(_){}
  if(!el) return;
  el.classList.add('qhl');
  if(!hlScrolled){ hlScrolled=true;
    setTimeout(()=>{ try{ el.scrollIntoView({block:'center',behavior:'smooth'}) }catch(_){} }, 60); }
}
function hlOff(){ if(!hlSel) return; hlSel=null; clearTimeout(hlTO);
  document.querySelectorAll('.qhl').forEach(e=>e.classList.remove('qhl')) }
/* 칩 클릭은 pointerdown → click 순서라, 이 리스너가 먼저 돌 때는 아직 pin 이 없다.
   그래서 '켠 그 탭'이 바로 끄는 일은 생기지 않는다 */
addEventListener('pointerdown', hlOff, true);

function questStart(){
  S.qDone = S.qDone || {};
  /* 진행 중인 세이브에는 정적 라인을 띄우지 않는다.
     ⚠ 판정을 t0 로 한다. 예전엔 uLv('seat')>0 을 봤는데, 새 게임이 의자 1개를
     들고 시작하게 되면서 첫 실행까지 '진행 중'으로 오판해 튜토리얼이 통째로 건너뛰어졌다 */
  const oldSave = !S.t0 && (shopLv()>2 || S.best>1
                    || Object.keys(S.made||{}).length>1 || (S.served||0)>0);
  if(!S.t0)   S.t0 = now();
  if(!S.sold) S.sold = {};
  if(!S.qMig){ S.qMig=1;
    if(oldSave) for(const q of QUEST) S.qDone[q.id]=1;
    save();
  }
  qCur=null; qReady=false;
}
function questSkip(){ for(const q of QUEST) S.qDone[q.id]=1; if(qCur) S.qDone[qCur.id]=1;
  qCur=null; qReady=false; save(); toast('가이드를 껐습니다 · 상점에서 다시 켤 수 있어요'); S.qOff=1 }
function questPick(){
  const nx = QUEST.find(q=>!S.qDone[q.id]);
  if(nx){
    let ok=true; try{ ok = !nx.when || nx.when() }catch(_){}
    return ok ? nx : null;              // 조건 전이면 칩을 아예 안 띄운다 — 다음 것으로 넘기지 않는다
  }
  return pickQuest();
}
function questTick(){
  if(S.qOff) return qHide();
  if(!qCur){ qCur=questPick(); qReady=false }
  if(!qCur){ qHide(); return }             // 조건 대기 중 — 조용히 판다
  /* 조건을 채워도 바로 치우지 않는다. 칩이 '받기'로 바뀌고, 눌러야 넘어간다 —
     한 일과 받은 것이 한 번의 탭으로 이어져야 보상으로 읽힌다 */
  if(qCur && !qReady){ let d=false; try{ d=qCur.done() }catch(_){}
    if(d){ qReady=true; qLast=''; hlOff(); SFX('unlock') } }
  qBar(); qSpot();
}
const QUEST_GEM = 2;
function qClaim(){
  if(!qReady || !qCur) return;
  const q=qCur;
  S.qDone[q.id]=1; S.gem+=QUEST_GEM; save(); SFX('lvup');
  banner('💎 +'+QUEST_GEM, (typeof q.t==='function'?q.t():q.t) + ' 완료');
  qCur=null; qReady=false; qLast=''; qSpotLast='';
  if(q.onClaim) try{ q.onClaim() }catch(_){}
  qCur=questPick(); qBar(); qSpot();
}
function qHide(){ const b=$('qbar'); if(b) b.classList.remove('on');
  const e=$('tut'); if(e) e.classList.remove('on'); document.body.classList.remove('tuton') }

/* 배너 — 매장 화면에서만. 다른 탭은 그 화면의 일이 이미 명확하다 */
function qBar(){
  let b=$('qbar');
  if(!b){ b=document.createElement('div'); b.id='qbar';
    b.innerHTML=`<i class="qi">📋</i><span class="qw"><b class="qt"></b><em class="qs"></em>
      <span class="qbar2"><i></i></span></span><u class="qgo">›</u>
      <button class="qclaim">받기</button>
      <button class="qx" onclick="event.stopPropagation();questSkip()">✕</button>`;
    b.onclick=()=>{ if(qReady) return qClaim();
      const q=qCur;
      if(q&&q.go) q.go(); else if(q&&q.tab) go(q.tab);
      if(q&&q.hl) hlPin(q.hl); };
    document.body.appendChild(b);
  }
  /* 평소엔 매장에서만 — 다른 탭은 그 화면의 할 일이 이미 명확하다.
     단 '받기' 대기 중이면 어느 탭에 있든 띄운다. 받을 게 있는 걸 숨기면 안 된다 */
  const on = qCur && !document.body.classList.contains('inpuz')
             && !document.body.classList.contains('ovon')
             && (qReady || tab==='store');
  b.classList.toggle('on', !!on);
  b.classList.toggle('done', !!qReady);
  if(!on || !qCur) return;
  const qt = typeof qCur.t==='function' ? (()=>{ try{ return qCur.t() }catch(_){ return '' } })() : qCur.t;
  const key = (qReady?'R|':'') + qCur.id + '|' + qt + '|' + (qCur.cur?qCur.cur():'');
  if(key===qLast) return; qLast=key;
  const pb=b.querySelector('.qbar2');
  if(qReady){
    b.querySelector('.qi').textContent='🎉';
    b.querySelector('.qt').textContent=qt;
    b.querySelector('.qs').textContent=`완료! 💎 ${QUEST_GEM} 받기`;
    pb.style.display='none'; return;
  }
  b.querySelector('.qi').textContent='📋';
  b.querySelector('.qt').textContent = qt;
  b.querySelector('.qs').textContent = qCur.s || '';
  if(qCur.n){ const c=Math.min(qCur.n, qCur.cur()); pb.style.display='block';
    pb.firstElementChild.style.width=(c/qCur.n*100)+'%';
    b.querySelector('.qs').textContent = `${qCur.s} · ${c}/${qCur.n}`;
  } else pb.style.display='none';
}
/* 스포트라이트 — 좌표는 전부 % 다(대상 rect ÷ 뷰포트). 기기·회전에 안 흔들린다.
   가림막 4장으로 구멍을 만든다 — box-shadow 한 장이면 구멍까지 클릭이 막힌다 */
function qSpot(){
  const e0=$('tut');
  if(!qCur || qReady || !qCur.spot || document.body.classList.contains('ovon')){ if(e0) e0.classList.remove('on'); document.body.classList.remove('tuton'); return }
  let el=null; try{ el=qCur.spot() }catch(_){}
  if(!el || !el.getBoundingClientRect){ if(e0) e0.classList.remove('on'); document.body.classList.remove('tuton'); return }
  /* ⚠ 아직 해금 안 된 탭은 자리만 지키고 모습은 감춰 둔다(.navlock).
     그걸 비추면 화면이 가림막으로 덮인 채 누를 게 아무것도 없어 갇힌다 */
  if(el.classList.contains('navlock') || el.closest('.navlock')
     || getComputedStyle(el).visibility==='hidden'){ if(e0) e0.classList.remove('on'); document.body.classList.remove('tuton'); return }
  const r=el.getBoundingClientRect();
  if(r.width<4||r.height<4){ if(e0) e0.classList.remove('on'); document.body.classList.remove('tuton'); return }
  const W=innerWidth, H=innerHeight, P=8;
  const L=Math.max(0,(r.left-P)/W*100),  T=Math.max(0,(r.top-P)/H*100);
  const R=Math.min(100,(r.right+P)/W*100), B=Math.min(100,(r.bottom+P)/H*100);
  let e=e0;
  if(!e){ e=document.createElement('div'); e.id='tut';
    e.innerHTML=`<i class="tm t"></i><i class="tm r"></i><i class="tm b"></i><i class="tm l"></i>
      <div class="thole"></div><div class="tfin">👆</div>`;
    document.body.appendChild(e); }
  e.classList.add('on'); document.body.classList.add('tuton');
  const key=qCur.id+'|'+L.toFixed(1)+T.toFixed(1)+R.toFixed(1)+B.toFixed(1);
  if(key===qSpotLast) return; qSpotLast=key;
  const set=(q,st)=>Object.assign(e.querySelector(q).style, st);
  set('.tm.t',{left:'0',top:'0',width:'100%',height:T+'%'});
  set('.tm.b',{left:'0',top:B+'%',width:'100%',height:(100-B)+'%'});
  set('.tm.l',{left:'0',top:T+'%',width:L+'%',height:(B-T)+'%'});
  set('.tm.r',{left:R+'%',top:T+'%',width:(100-R)+'%',height:(B-T)+'%'});
  set('.thole',{left:L+'%',top:T+'%',width:(R-L)+'%',height:(B-T)+'%'});
  /* 손가락은 대상 아래에 서면 위를, 위에 서면 아래를 가리킨다.
     늘 👆 로 두면 화면 하단 버튼(매장 관리 등)에서 손이 뒤집혀 보인다 */
  const below=(100-B)>26;
  const fin=$q('#tut .tfin'); if(fin) fin.textContent = below?'👆':'👇';
  set('.tfin',{left:((L+R)/2)+'%', top:(below?B:T)+'%',
    transform:'translate(-50%,'+(below?'2px':'-100%')+')'});
}

      if(!uLv('seat')) S.up.seat=2;
    }
  }
  heartTick(); initStaff(); document.body.classList.add('tstore');
  if(!load()) setTimeout(showTitle, 60);            // 세이브가 없을 때만 타이틀
  const off = (now()-(S.lastSeen||now()) >= OFF_MIN) ? offline() : 0;   // 15분 미만이면 조용히 넘어간다
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t));
  draw();
  requestAnimationFrame(t=>{lastTick=t;loop(t)});
  if(off>0){
    const h=Math.min(idleCapH(), (now()-S.lastSeen)/3600000);
    $('sheet').innerHTML=`<p class="big">다녀오셨어요!</p>
      <p class="sub">${h.toFixed(1)}시간 동안 가게가 돌아갔습니다 <span style="font-size:11px">(상한 ${idleCapH()}시간)</span></p>
      <div class="card" style="text-align:center;padding:16px"><div style="font-size:26px;font-weight:900;color:var(--gold)">+${G(off)}</div></div>
      <button class="mbtn" onclick="S.gold+=${off};save();ovClose()">받기</button>
      <button class="mbtn ghost" onclick="S.gold+=${off*2};save();ovClose();toast('광고 시청 · 2배 수령')">📺 광고 보고 2배</button>`;
    $('ov').classList.add('on'); document.body.classList.add('ovon');
  }
  questStart();
})();
</script></body></html>
