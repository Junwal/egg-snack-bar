<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>알 스낵바 — 프로토</title>
<style>
 :root{ --bg:#12131a; --pnl:#1b1d27; --pnl2:#232735; --line:#2a2d3a; --txt:#e8e9ef; --dim:#8b90a3;
        --ok:#6ee7a8; --gold:#ffd166; --gem:#8ad8ff; --hot:#ff7a59; --pz:#a99bff; --sky:#7cb0ff }
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);user-select:none;
  font-family:-apple-system,"Noto Sans CJK KR","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(120% 62% at 50% 34%,#1d2030 0%,#14161f 46%,#0d0e14 100%),var(--bg)}
 #app{max-width:440px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
 button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

 /* ── 상단 HUD ── */
 #hud{flex:0 0 auto;padding:8px 10px 4px;display:flex;gap:6px;align-items:center}
 #cur{display:flex;gap:6px;align-items:center}
 #hTitle{font-size:15px;font-weight:900;letter-spacing:-.01em;color:#cfd4e4;padding:4px 2px}
 #hTitle .t{font-size:11px;color:#8b90a3;font-weight:800;margin-right:3px}
 #hTitle b{color:#fff}
 #hTitle.tap{cursor:pointer}
 #hTitle.tap::after{content:'›';margin-left:4px;color:#8b90a3;font-weight:900}
 #hTitle.tap:active{opacity:.7}
 #gaugerow{flex:0 0 auto;padding:0 12px 7px;display:flex;gap:7px;align-items:center}
 #gaugeN{font-size:9.5px;font-weight:800;color:#6b7186;font-variant-numeric:tabular-nums;
   flex:0 0 auto;min-width:36px;text-align:right}
 .chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;
  border:1px solid var(--line);background:linear-gradient(180deg,#232735,#181b25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);font-size:12.5px;font-weight:900;
  font-variant-numeric:tabular-nums;white-space:nowrap}
 .chip.g b{color:var(--gold)} .chip.m b{color:var(--gem)} .chip.h b{color:#ff8fa0}
 .chip .t{font-size:9px;color:#6b7186;font-weight:800}
 .chip .hic{width:13px;height:13px;vertical-align:-2px}
 .chip.h{cursor:pointer}
 .chip .ht{font-size:9px;font-style:normal;color:#8b90a3;font-weight:800;margin-left:1px}
 #gauge{flex:1;height:8px;border-radius:99px;background:#242a38;overflow:hidden;position:relative;
   border:1px solid #313850}
 #gauge i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#e87ea6,#ffa8c9);width:0%;transition:width .3s}
 .gi{width:1.05em;height:1.05em;vertical-align:-.16em;margin-right:.16em}
 .fic{width:15px;height:15px;vertical-align:-3px;margin-right:3px}
 .gn{font-variant-numeric:tabular-nums}
 #mission{flex:0 0 auto;padding:4px 10px 7px;font-size:10.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
 #mission b{color:#cfd4e4}

 /* ── 본문 ── */
 /* 거터를 항상 잡아둔다. 요리 탭에서만 스크롤바가 생기면 카드 너비가 8px 틀어진다 */
 #view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 8px;
   scrollbar-gutter:stable;
   position:relative;scrollbar-width:thin;scrollbar-color:#4d5678 rgba(255,255,255,.04)}
 #view::-webkit-scrollbar{width:8px}
 #view::-webkit-scrollbar-track{background:rgba(255,255,255,.035);border-radius:99px;margin:4px 0}
 #view::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#606b95,#3b4363);border-radius:99px;
   border:2px solid transparent;background-clip:content-box;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
 #view.full{padding:0;overflow:hidden}
   scrollbar-width:thin;scrollbar-color:#39405a transparent}
 /* ── 스크롤 : 게임 전체 한 벌 ── */
 .scr{scrollbar-width:thin;scrollbar-color:#4d5678 rgba(255,255,255,.04)}
 .scr::-webkit-scrollbar{width:8px;height:8px}
 .scr::-webkit-scrollbar-track{background:rgba(255,255,255,.035);border-radius:99px;
   margin:4px 0}
 .scr::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#606b95,#3b4363);
   border-radius:99px;border:2px solid transparent;background-clip:content-box;
   box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
 .scr::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#7885b4,#4a5478);background-clip:content-box}
 .scr::-webkit-scrollbar-thumb:active{background:linear-gradient(180deg,#8b98c8,#586390);background-clip:content-box}
 .scr::-webkit-scrollbar-corner{background:transparent}

 /* ── 매장 (전체 화면) ── */
 #stage{position:absolute;inset:0;overflow:hidden}
 #bg{position:absolute;inset:0;width:100%;height:100%;display:block}
 .lay{position:absolute;inset:0;pointer-events:none}
 .walkers .w{position:absolute}
 .ent{position:absolute;text-align:center;transform:translate(-50%,-100%);will-change:left,top}
 .ent .sp{display:block}
 .ent.flip .sp{transform:scaleX(-1)}
 /* 뽈뽈뽈 — 몸통 바운스는 svg, 팔다리는 파츠에 따로 건다 */
 .walking svg{animation:bob .34s ease-in-out infinite}
 @keyframes bob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-4px) rotate(2.5deg)}}
 .ent:not(.walking) svg{animation:brea 2.6s ease-in-out infinite}
 @keyframes brea{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
 .ent svg .aL,.ent svg .aR,.ent svg .lL,.ent svg .lR{transform-box:fill-box;transform-origin:50% 15%}
 .walking svg .aL,.walking svg .lR{animation:swA .34s ease-in-out infinite}
 .walking svg .aR,.walking svg .lL{animation:swB .34s ease-in-out infinite}
 @keyframes swA{0%,100%{transform:rotate(-19deg)}50%{transform:rotate(19deg)}}
 @keyframes swB{0%,100%{transform:rotate(19deg)}50%{transform:rotate(-19deg)}}
 .ent svg .mo{transform-box:fill-box;transform-origin:center;animation:chew .5s ease-in-out infinite}
 @keyframes chew{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
 .sadfx svg{animation:shk .42s ease-in-out infinite!important}
 @keyframes shk{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
 /* 받아서 신난 손님 — 콩콩 뛴다 */
 .joyfx svg{animation:joy .42s cubic-bezier(.3,1.4,.5,1) infinite!important}
 @keyframes joy{0%,100%{transform:translateY(0) scale(1,1)}
   35%{transform:translateY(-11px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.05,.94)}}
 /* 사과 중인 알바몬 — 훌쩍 */
 .cryfx svg{animation:cry .9s ease-in-out infinite!important}
 @keyframes cry{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(2px) rotate(3deg)}}
 .cryfx .sp::after{content:'💧';position:absolute;left:56%;top:34%;font-size:11px;
   animation:tear 1.1s linear infinite}
 @keyframes tear{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
 .ent .sp{position:relative}
 .guest .bub{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;
   background:#fdfbf2;color:#2a2f3a;border-radius:7px;padding:2.5px 6px;font-size:10px;font-weight:900;
   box-shadow:0 2px 7px rgba(0,0,0,.5);z-index:3;line-height:1.15}
 .guest .bub::after{content:'';position:absolute;bottom:-5px;left:50%;margin-left:-5px;
   border:5px solid transparent;border-top-color:#fdfbf2}
 .guest .bub.ok{background:#ffd7e0}
 .guest .bub.bad{background:#ffdcd2;color:#8a3520}
 .bub{animation:bubIn .22s cubic-bezier(.34,1.6,.64,1) both}
 .guest .bub.hi{bottom:calc(100% + 24px)}
 .guest .bub.hi::after{display:none}
 .guest .bub.chat{background:#eef6ff}
 .guest .bub.chat::after{border-top-color:#eef6ff}
 .staff .bub{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);
   white-space:nowrap;background:#fff1c9;color:#4a3410;border-radius:7px;padding:3px 8px;
   font-size:10px;font-weight:900;box-shadow:0 2px 7px rgba(0,0,0,.5);z-index:4;line-height:1.15}
 .staff .bub::after{content:'';position:absolute;bottom:-5px;left:50%;margin-left:-5px;
   border:5px solid transparent;border-top-color:#fff1c9}
 @keyframes bubIn{0%{opacity:0;transform:translateX(-50%) scale(.5) translateY(6px)}
   100%{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}}
 .staff .ring.wait{background:rgba(20,24,32,.85);font-size:11px}
 .staff .ring{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:22px;height:22px;
   border-radius:99px;background:conic-gradient(#ffd166 var(--p,0%),rgba(20,24,32,.8) 0);
   box-shadow:0 0 0 2px rgba(20,24,32,.65);display:flex;align-items:center;justify-content:center;
   font-size:9px;z-index:2}
 .staff .ring::before{content:'';position:absolute;inset:3.5px;border-radius:99px;background:#1b2030}
 .staff .ring{line-height:1;font-size:10px}
 .staff .ring>*{position:relative}
 .coinfx.sm{font-size:10px;color:#ffd166;opacity:.9;animation-duration:.85s}
 .coinfx .fg,.coinfx .fx2{display:inline-flex;align-items:center;gap:1px;
   background:rgba(12,14,20,.62);border-radius:99px;padding:2px 8px 2px 5px;
   box-shadow:0 2px 8px rgba(0,0,0,.5)}
 .coinfx .fg{color:#ffe08a}
 .coinfx .fv{font-style:normal;color:#ff9fd0;margin-left:2px}
 .coinfx .fx2{color:#ffb8dd;font-size:13px;margin-top:3px}
 .coinfx .gi,.coinfx .xi{width:14px;height:14px;vertical-align:-2px;margin-right:1px}
 .coinfx.sm .fg{padding:1px 6px 1px 4px}
 .coinfx.sm .gi{width:11px;height:11px}
 .coinfx{position:absolute;font-size:15px;font-weight:900;color:#ffe08a;pointer-events:none;
   animation:cfx 1.1s ease-out forwards;text-shadow:0 2px 3px rgba(0,0,0,.7);z-index:5}
 @keyframes cfx{0%{opacity:0;transform:translateY(0) scale(.7)}18%{opacity:1;transform:translateY(-7px) scale(1.15)}
   100%{opacity:0;transform:translateY(-30px) scale(1)}}
 #bg{pointer-events:none}
 #bg .lockov{pointer-events:auto;cursor:pointer}
 #closed{position:absolute;inset:0;background:rgba(9,10,15,.8);display:none;
   flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--dim);z-index:9}
 #closed.on{display:flex}
 /* 매장 위에 뜨는 조작 버튼 */
 #fabs{position:absolute;left:0;right:0;bottom:9px;display:flex;gap:7px;padding:0 10px;z-index:8}
 .fab{flex:1;padding:12px 6px;border-radius:13px;font-size:13.5px;font-weight:900;
   box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);
   display:flex;align-items:center;justify-content:center;gap:5px}
 .fab.hunt{background:linear-gradient(180deg,#8a7bf0,#6155c4);color:#fff}
 .fab.mng{background:linear-gradient(180deg,#f2e7c9,#d9bd80);color:#3a2a08}
 .fab.menu2{background:linear-gradient(180deg,#9fdcb4,#5fa87c);color:#0d2a19}
 .fab:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
 .fab .n{position:absolute;top:-5px;right:-4px;min-width:16px;height:16px;border-radius:99px;
   background:var(--hot);color:#fff;font-size:9.5px;font-weight:900;display:flex;align-items:center;
   justify-content:center;padding:0 4px;border:2px solid #171923}
 #boxbtn{position:absolute;right:9px;bottom:104px;z-index:8;width:60px;
   background:linear-gradient(180deg,#3a3040,#241d2a);border:1px solid #57485f;border-radius:13px;
   padding:7px 4px 5px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.45)}
 #boxbtn:active{transform:translateY(3px);box-shadow:none}
 #boxbtn .bi{font-size:19px;line-height:1}
 #boxbtn .bn{font-size:9.5px;font-weight:900;color:#e0d4ef;margin-top:2px;font-variant-numeric:tabular-nums}
 #boxfx.pop{animation:bpop .28s cubic-bezier(.34,1.6,.64,1)}
 @keyframes bpop{0%{transform:scale(1)}45%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}
 /* 스탯은 화면 아래가 아니라 매장 위에 얹는다 — 하단 3겹이 연출 높이를 다 먹었다 */
 #statline{position:absolute;left:9px;right:9px;top:9px;display:flex;gap:5px;z-index:7}
 .st1{flex:1;background:rgba(14,17,24,.74);border:1px solid rgba(255,255,255,.1);border-radius:9px;
   padding:4px 5px 5px;text-align:center;backdrop-filter:blur(4px)}
 .st1 .k{font-size:8.5px;color:#9aa2b8;font-weight:800;letter-spacing:.02em;
   display:flex;align-items:center;justify-content:center;gap:2px}
 .st1 .k svg{width:10px;height:10px}
 .st1 .v{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff;margin-top:1px}
 .st1 .v.gold{color:var(--gold)}
 /* ── 카드 · 리스트 ── */
 .sec{font-size:10.5px;font-weight:800;color:#6b7186;letter-spacing:.1em;margin:11px 2px 6px}
 .card{background:linear-gradient(180deg,#20232f,#171923);border:1px solid var(--line);
   border-radius:11px;padding:9px 11px;margin-bottom:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
 .row{display:flex;align-items:center;gap:9px}
 .row .ic{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:#272b39;
   display:flex;align-items:center;justify-content:center;font-size:15px}
 .row .tx{flex:1;min-width:0}
 .row .nm{font-size:13px;font-weight:800;letter-spacing:-.01em}
 .row .ds{font-size:10.5px;color:var(--dim);margin-top:1px;line-height:1.4}
 .row .lv{font-size:10px;font-weight:900;color:#7c839a;margin-left:4px}
 .buy{flex:0 0 auto;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:900;
   background:linear-gradient(180deg,#3a4considered,#2a2f3d)}
 .buy{background:linear-gradient(180deg,#39405a,#282d3f);border:1px solid #46506e;
   box-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap;font-variant-numeric:tabular-nums}
 .buy.able{background:linear-gradient(180deg,#f0e6c8,#e0c98a);color:#2a1f00;border-color:#e0c98a}
 .buy.able:active{transform:translateY(2px);box-shadow:none}
 .buy:disabled{opacity:.35}
 .buy.pz{background:linear-gradient(180deg,#7a6de0,#5a4fb8);border-color:#8b7ff0;color:#fff}

 /* ── 인벤 ── */
 .invgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
 /* ── 상점 ── */
 .bnr{display:flex;gap:9px;align-items:center;width:100%;padding:11px;border-radius:15px;margin-bottom:7px;
   border:2px solid;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.4)}
 .bnr.a{background:linear-gradient(135deg,#3a2c5e,#241d3a);border-color:#6a55b8}
 .bnr.b{background:linear-gradient(135deg,#1e3a4e,#16283a);border-color:#3b7fa8}
 .bnr:active{transform:translateY(3px);box-shadow:none}
 .bnr .bl{flex:0 0 auto;width:112px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center}
 .bnr .bgold{display:flex;flex-direction:column;align-items:center}
 .bnr .bgold svg{width:44px;height:34px}
 .bnr .bgold span{font-size:9px;font-weight:900;color:var(--gold)}
 .bnr .bitems{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
 .bnr .bi{position:relative;width:26px;height:26px;background:rgba(0,0,0,.32);border-radius:7px;
   display:flex;align-items:center;justify-content:center}
 .bnr .bi svg{width:17px;height:17px}
 .bnr .bi i{position:absolute;right:-2px;bottom:-3px;font-size:8.5px;font-weight:900;font-style:normal;
   background:#12131a;border-radius:5px;padding:0 3px;color:#e8e9ef}
 .bnr .bh{display:flex;align-items:center;gap:2px}
 .bnr .bh svg{width:16px;height:16px} .bnr .bh i{font-size:9px;font-weight:900;font-style:normal;color:#ff8fa0}
 .bnr .br{flex:1;min-width:0}
 .bnr .bn{font-size:15px;font-weight:900;letter-spacing:-.01em}
 .bnr .bd{font-size:10.5px;color:#b3b9cc;margin:1px 0 7px}
 .bnr .bp{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(180deg,#9fdcb4,#5fa87c);
   color:#0d2a19;font-size:13px;font-weight:900;border-radius:9px;padding:5px 12px}
 .bnr .bp svg{width:13px;height:13px}
 .bnr .bp.krw{background:linear-gradient(180deg,#ffe08a,#e0ab3c);color:#3a2a08}
 .gcard.gem{background:linear-gradient(180deg,#16283a,#101c2a);border-color:#2d5a7a;position:relative}
 .gcard .gemv{color:var(--gem)}
 .gcard .gtag{position:absolute;top:-7px;right:6px;background:linear-gradient(180deg,#ff9d6e,#e2653a);
   color:#2a1206;font-size:9px;font-weight:900;border-radius:99px;padding:2px 7px;
   box-shadow:0 2px 6px -1px rgba(0,0,0,.6)}
 .gcard .gpr.krw{background:linear-gradient(180deg,#ffe08a,#e0ab3c);color:#3a2a08;border-color:#c8992e}
 .buy.wgem{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;white-space:nowrap}
 .buy.wgem svg{width:14px;height:14px;flex:0 0 auto}
 .igrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
 .icard{background:linear-gradient(180deg,#20232f,#171923);border:1px solid var(--line);
   border-radius:11px;padding:7px 2px 6px;text-align:center;display:flex;flex-direction:column;gap:1px}
 .icard .ii{height:22px;display:flex;align-items:center;justify-content:center}
 .icard .ii svg{width:21px;height:21px}
 .icard .inm{font-size:9px;font-weight:800;color:#cfd4e4;line-height:1.15;min-height:21px;
   display:flex;align-items:center;justify-content:center;padding:0 1px}
 .icard .ihv{font-size:8.5px;color:#6b7186;font-weight:800}
 .icard .ipr{margin-top:3px;font-size:10px;font-weight:900;color:#8b90a3;background:#20242f;
   border:1px solid var(--line);border-radius:6px;padding:2px 0;display:flex;align-items:center;
   justify-content:center;gap:2px}
 .icard .ipr svg{width:10px;height:10px}
 .icard.able .ipr{background:linear-gradient(180deg,#9fdcb4,#5fa87c);color:#0d2a19;border-color:#5fa87c}
 .icard:active{transform:translateY(1px)}
 .ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
 .gcard{background:linear-gradient(180deg,#262032,#1a1723);border:1px solid #3a3050;
   border-radius:13px;padding:9px 4px 7px;text-align:center;display:flex;flex-direction:column;gap:2px}
 .gcard .gp{height:34px;display:flex;align-items:flex-end;justify-content:center}
 .gcard .gp svg{width:44px;height:34px}
 .gcard .gv{font-size:13px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
 .gcard .gpr{margin-top:3px;font-size:11px;font-weight:900;color:#8b90a3;background:#20242f;
   border:1px solid var(--line);border-radius:7px;padding:3px 0;display:flex;align-items:center;
   justify-content:center;gap:3px}
 .gcard .gpr svg{width:11px;height:11px}
 .gcard.able .gpr{background:linear-gradient(180deg,#9fdcb4,#5fa87c);color:#0d2a19;border-color:#5fa87c}
 .gcard:active{transform:translateY(1px)}
 /* 상점만 라이트 — 파는 곳은 밝아야 물건이 보인다 */
 #view.shoplight{background:linear-gradient(180deg,#f4f1ea,#e8e4dc);border-radius:14px 14px 0 0}
 #view.shoplight .sec{color:#8a8474}
 #view.shoplight .card{background:linear-gradient(180deg,#fff,#f6f3ec);border-color:#ded8cc;
   box-shadow:0 1px 0 rgba(0,0,0,.04)}
 #view.shoplight .nm{color:#2b2a26} #view.shoplight .ds{color:#7b7568}
 #view.shoplight .row .ic{background:#efeadf}
 #view.shoplight .icard,#view.shoplight .gcard{background:linear-gradient(180deg,#fff,#f2eee5);
   border-color:#ded8cc}
 #view.shoplight .icard .inm{color:#3a382f} #view.shoplight .icard .ihv{color:#9a9384}
 #view.shoplight .icard .ipr,#view.shoplight .gcard .gpr{background:#efeadf;border-color:#ded8cc;color:#7b7568}
 #view.shoplight .icard.able .ipr,#view.shoplight .gcard.able .gpr{
   background:linear-gradient(180deg,#8fd6a8,#4f9d72);color:#08240f;border-color:#4f9d72}
 #view.shoplight .gcard.gem{background:linear-gradient(180deg,#eef8ff,#dcecf8);border-color:#b9d6e8}

    해금될 때마다 남은 탭이 좌우로 밀려서, 늘 누르던 자리가 매번 바뀐다 */
 #tabs{flex:0 0 auto;display:flex;gap:3px;
   padding:6px 7px calc(7px + env(safe-area-inset-bottom));
   border-top:1px solid var(--line);background:linear-gradient(180deg,#1a1d27,#13151d)}
 .tab{flex:1 1 0;max-width:20%;padding:7px 2px 5px;border-radius:12px;text-align:center;position:relative;
   transition:background .18s ease}
 .tab .ti{font-size:17px;line-height:1;transition:font-size .18s cubic-bezier(.34,1.5,.64,1)}

   transition:opacity .14s ease,height .18s ease;height:11px;overflow:hidden}

   box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 12px -4px rgba(255,193,78,.65)}

 .tab.navlock{visibility:hidden;pointer-events:none}   /* 자리는 지키고 모습만 감춘다 */

   box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
 .seg button i{display:inline-block;width:7px;height:7px;border-radius:99px;
   background:#ff5d5d;margin-left:5px;vertical-align:middle}

 /* 사냥터 카드 — 그림이 조작 영역. 좌우 화살표/스와이프로 넘긴다 */
 .hcard{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
   margin-bottom:14px;background:#161923;touch-action:pan-y;user-select:none}
 .hcard .hbg{aspect-ratio:16/11;background-size:cover;background-position:center}
 .hcard .hsh{position:absolute;inset:0;pointer-events:none;
   background:linear-gradient(105deg,rgba(10,12,18,.55) 0%,rgba(10,12,18,.12) 42%,rgba(10,12,18,.62) 100%)}
 /* 이름은 좌상단. 숫자는 접두사 없이 숫자만 */
 .hcard .hbot{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:8px}
 .hcard .hno{background:var(--gold);color:#2a1f05;font-size:15px;font-weight:900;
   min-width:30px;text-align:center;padding:4px 8px;border-radius:9px;flex:0 0 auto}
 .hcard .hnm{font-size:23px;font-weight:900;letter-spacing:-.03em;line-height:1.1;
   text-shadow:0 2px 10px rgba(0,0,0,.8)}
 /* 우측 세로 컬럼 — 선택 버튼 아래로 권장 알바몬이 쭉 내려온다 */
 .hcard .hright{position:absolute;top:10px;right:10px;width:132px;
   display:flex;flex-direction:column;gap:7px;align-items:stretch}
 .hcard .hsel{background:rgba(12,14,20,.76);border:1px solid rgba(255,255,255,.24);
   color:#fff;font-size:12.5px;font-weight:900;padding:9px 10px;border-radius:11px;
   cursor:pointer;backdrop-filter:blur(3px)}
 .hcard .hplab{font-size:10px;font-weight:900;color:#e6ebf5;text-align:right;
   text-shadow:0 1px 4px rgba(0,0,0,.9);line-height:1.35}
 .hcard .hplab u{display:block;font-size:9px;font-weight:800;color:#c2cadb;text-decoration:none}
 .hcard .hpets{display:flex;flex-direction:column;gap:5px}
 .hpet{display:flex;align-items:center;gap:5px;padding:5px 9px 5px 6px;border-radius:10px;
   background:rgba(12,14,20,.72);border:1px solid rgba(255,255,255,.16);
   font-size:13px;font-weight:900;backdrop-filter:blur(3px)}
 .hpet b{margin-left:auto}
 .hpet u{text-decoration:none;color:#aab1c4;font-size:11px;font-weight:800}
 .hpet.low{border-color:#8a4a42;background:rgba(52,24,22,.8);color:#ff9f8f}
 .hpet.low u{color:#c98d84}
 .hpet.ok b{color:var(--ok)}
 /* 화살표는 카드 아래쪽 모서리. 세로 중앙에 두면 우측 알바몬 컬럼과 겹친다 */
 .harr{position:absolute;bottom:10px;width:46px;height:40px;
   border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(10,12,18,.5);
   color:#fff;font-size:24px;font-weight:900;line-height:1;cursor:pointer;backdrop-filter:blur(3px)}
 .harr.l{left:10px} .harr.r{right:10px}
 .harr:active{background:rgba(10,12,18,.7)}
 .hcard.lock .hbg{filter:grayscale(.75) brightness(.55)}
 .hlock{margin:0 0 12px;padding:13px;border-radius:14px;background:#2a1c1c;
   border:1px solid #4a2c2c;font-size:13px;font-weight:800;color:#ffb0a0;text-align:center}
 .hsec{font-size:13px;font-weight:900;color:#8d93a6;margin:0 0 8px 2px}
 /* 획득 재료 = 세로 카드 레일 */
 .lcd{flex:0 0 78px;background:#20242f;border:1px solid var(--line);border-radius:12px;
   padding:8px 4px 9px;text-align:center;line-height:1.3}
 .lcd i{display:block;font-size:9.5px;font-weight:900;font-style:normal}
 .lcd em{display:block;font-size:26px;font-style:normal;margin:3px 0 2px;line-height:1}
 .lcd b{display:block;font-size:11.5px;font-weight:800;color:#cfd4e4;white-space:nowrap;
   overflow:hidden;text-overflow:ellipsis}
 .lcd u{display:block;font-size:14px;font-weight:900;color:var(--gold);
   text-decoration:none;font-variant-numeric:tabular-nums;margin-top:2px}

 /* ── 메뉴 개발 화면 ──
    색이 정보를 나르는 축을 둘로 줄였다. 계열 = 상단 4px 바 하나,
    상태(충족/부족) = 초록·빨강. 등급은 색이 아니라 한글로 쓴다.
    전에는 카드 하나에 색이 다섯이라 "지금 만들 수 있는 것"이 안 보였다 */
 .devgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
 .mcard{aspect-ratio:3/4.3;display:flex;flex-direction:column;border-radius:16px;
   border:1px solid var(--line);background:linear-gradient(180deg,#20232f,#171923);
   overflow:hidden;position:relative}
 .mcard.dim{opacity:.66}
 .mcard .mbar{height:4px;flex:0 0 auto}
 .mcard .mtop{flex:0 0 30%;display:flex;align-items:center;justify-content:center;
   font-size:38px;background:#1b1e29}
 .mcard .mmiss{position:absolute;top:9px;right:9px;font-size:10px;font-weight:900;color:#ffb454}
 .mcard .mstar{position:absolute;top:8px;right:9px;font-size:11px;letter-spacing:-1px}
 .mcard .mstar b{color:#3a4155;font-weight:900} .mcard .mstar b.on{color:var(--gold)}
 .mcard .mkind{position:absolute;top:9px;left:9px;font-size:9.5px;font-weight:900;
   padding:3px 7px;border-radius:7px;background:#2b3145;color:#aeb4c6}
 .mcard .mkind.up{background:#3a3218;color:#ffd166}
 .mcard .mbody{flex:1;min-height:0;padding:9px 11px 0;display:flex;flex-direction:column;gap:3px}
 .mcard .mnm{font-size:15px;font-weight:900;letter-spacing:-.02em;line-height:1.25}
 .mcard .mtier{font-size:10.5px;font-weight:800;color:#767c90}
 .mcard .mpr{font-size:12.5px;font-weight:900;color:#c9cfe0;margin-top:1px}
 .mcard .mreq{display:flex;flex-direction:column;gap:3px;margin-top:5px}
 .mcard .mr1{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#aeb4c6}
 .mcard .mr1 b{margin-left:auto;font-variant-numeric:tabular-nums}
 .mcard .mbtn2{margin:9px 11px 11px;padding:11px;border-radius:11px;border:1px solid var(--line);
   background:#20242f;color:#8d93a6;font-size:13.5px;font-weight:900;cursor:pointer}
 .mcard .mbtn2.able{background:linear-gradient(180deg,#f2e7c9,#d9bd80);color:#3a2a08;border-color:#c8ad74}
 .hback{background:none;border:none;color:var(--txt);font-size:19px;font-weight:900;
   padding:0 8px 0 0;cursor:pointer;line-height:1}

 /* ── 돌발 이벤트 ────────────────────────────────────────────
    도둑은 5초 안에 10탭(초당 2탭). 놓쳐도 골드 8%라 처벌이 아니라 아쉬움에 그친다 */
 .evnt{position:absolute;transform:translate(-50%,-100%);z-index:8;cursor:pointer;
   text-align:center;transition:filter .12s ease}
 .evnt.hit{filter:brightness(2.2)}
 .evnt .evi{font-size:30px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
 .evnt .evg{display:none;width:44px;height:6px;border-radius:99px;margin:3px auto 0;
   background:rgba(10,12,18,.7);border:1px solid rgba(255,255,255,.2);overflow:hidden}
 .evnt .evg i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ff6b5a,#ff9b4a);
   transition:width .12s linear}
 .evnt .evc{font-size:11px;font-weight:900;color:#8ad8ff;text-shadow:0 1px 3px rgba(0,0,0,.8)}

 /* ── 빈 슬롯 고스트 · 화로 배지 ────────────────────────────── */
 .gh ellipse,.gh rect{fill:none;stroke:#8d93a6;stroke-width:2;stroke-dasharray:5 4;opacity:.55}
 .gh text{fill:#8d93a6;font-size:13px;font-weight:900;text-anchor:middle;opacity:.7}
 .gh.able ellipse,.gh.able rect{stroke:#ffd166;opacity:1;animation:ghPulse 1.4s ease-in-out infinite}
 .gh.able text{fill:#ffd166;opacity:1}
 @keyframes ghPulse{0%,100%{opacity:.55}50%{opacity:1}}
 /* 화로 위 배지. 예전엔 .lv 만 스타일이 없어서 기본 남색(#20242f)이 그대로 떠
    화면에 검은 원이 불쑥 생긴 것처럼 보였다. 셋 다 '누를 것'으로 읽히게 밝게 깐다 */
 .wbadge circle{fill:#ffd166;stroke:#8a6d1e;stroke-width:1.6}
 .wbadge text{font-size:13px;text-anchor:middle;fill:#3a2c00;font-weight:900}
 .wbadge{animation:wbFloat 1.5s ease-in-out infinite;cursor:pointer;
   filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
 @keyframes wbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
 .wbadge.up circle{fill:#ffe08a;stroke:#a8791b}
 .wbadge.new circle{fill:#8fe0a8;stroke:#2c7a4a}
 .wbadge.lv circle{fill:#ffd166;stroke:#8a6d1e}

 /* ── 가이드 퀘스트 배너 ──────────────────────────────────────
    매장 화면 상단. 항상 한 개만. 탭하면 그 화면으로 점프한다 */
 #qbar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:440px;
   top:calc(env(safe-area-inset-top) + 116px);z-index:92;display:none;align-items:center;gap:8px;
   margin:0;padding:0 10px;cursor:pointer}
 #qbar.on{display:flex}
 #qbar::before{content:'';position:absolute;left:10px;right:10px;top:0;bottom:0;border-radius:14px;
   background:rgba(255,255,255,.90);border:1px solid rgba(255,255,255,.6);
   box-shadow:0 10px 26px -12px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
 #qbar>*{position:relative;z-index:1}
 #qbar .qi{flex:0 0 auto;font-size:19px;font-style:normal;margin-left:11px}
 #qbar .qw{flex:1;min-width:0;padding:9px 0}
 #qbar .qt{display:block;font-size:13.5px;font-weight:900;letter-spacing:-.02em;color:#181b24;
   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #qbar .qs{display:block;font-size:10.5px;font-weight:800;color:#5d6474;font-style:normal;
   overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
 #qbar .qbar2{display:none;height:4px;border-radius:99px;background:rgba(24,27,36,.16);margin-top:5px;overflow:hidden}
 #qbar .qbar2 i{display:block;height:100%;border-radius:99px;
   background:linear-gradient(90deg,#c8a24a,#e0c98a);transition:width .3s ease}
 #qbar .qgo{flex:0 0 auto;color:#8a7434;font-size:17px;font-weight:900;text-decoration:none}
 #qbar .qx{flex:0 0 auto;margin-right:12px;background:none;border:none;color:#9aa0ad;
   font-size:11px;font-weight:900;cursor:pointer;padding:6px 3px}
 /* 완료 대기 — 초록으로 바뀌고 '받기'가 뜬다. 눌러야 다음 퀘스트로 넘어간다.
    자동으로 사라지면 뭘 해서 뭘 받았는지가 안 남는다 */
 #qbar.done::before{background:linear-gradient(180deg,#b9f0c8,#8fdca6);
   box-shadow:0 8px 22px -8px rgba(70,190,120,.6)}
 #qbar.done{animation:qdone 1.15s ease-in-out infinite}
 @keyframes qdone{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.022)}}
 #qbar .qclaim{flex:0 0 auto;margin-right:11px;padding:6px 12px;border-radius:9px;border:none;
   background:#1f7a45;color:#eafff1;font-size:12px;font-weight:900;letter-spacing:-.01em;display:none}
 #qbar.done .qclaim{display:block}
 #qbar.done .qgo,#qbar.done .qx{display:none}
 /* 스포트라이트가 떠 있어도 하단 탭은 언제나 누를 수 있다 —
    안내 하나가 유저를 화면에 가두면 그건 안내가 아니라 사고다 */
 body.tuton #tabs{position:relative;z-index:96}
 body.ovon #qbar,body.inpuz #qbar{display:none}
 /* 완료 대기 중에는 모달·퍼즐 위가 아니면 어느 탭에서든 보인다 */
 body.ovon #qbar.done{display:none}

 /* ── 스포트라이트 ──────────────────────────────────────────
    좌표는 전부 % 다(대상 rect ÷ 뷰포트). 기기·회전·주소창에 안 흔들린다.
    가림막 4장으로 구멍을 만든다 — box-shadow 한 장이면 구멍까지 클릭이 막힌다 */
 #tut{position:fixed;inset:0;z-index:88;display:none;pointer-events:none}
 #tut.on{display:block}
 #tut .tm{position:absolute;background:rgba(6,7,12,.58);pointer-events:auto}
 #tut .thole{position:absolute;border-radius:14px;pointer-events:none;
   box-shadow:0 0 0 2px rgba(255,214,102,.95), 0 0 22px 4px rgba(255,214,102,.45);
   animation:tutPulse 1.35s ease-in-out infinite}
 @keyframes tutPulse{
   0%,100%{box-shadow:0 0 0 2px rgba(255,214,102,.95),0 0 22px 4px rgba(255,214,102,.42)}
   50%    {box-shadow:0 0 0 3px rgba(255,214,102,1),  0 0 34px 9px rgba(255,214,102,.20)}}
 #tut .tfin{position:absolute;font-size:26px;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
   animation:tutFin 1.1s ease-in-out infinite}
 @keyframes tutFin{0%,100%{margin-top:0}50%{margin-top:7px}}
 #tut .tcard{position:absolute;left:50%;transform:translateX(-50%);width:min(300px,84vw);
   background:linear-gradient(180deg,#20232f,#171923);border:1px solid #39405a;
   border-radius:15px;padding:13px 14px 12px;text-align:center;pointer-events:auto;
   box-shadow:0 18px 40px -14px rgba(0,0,0,.85)}
 #tut .tt{display:block;font-size:15px;font-weight:900;color:var(--gold);margin-bottom:3px}
 #tut .ts{display:block;font-size:12px;line-height:1.55;color:#a7adc0}
 #tut .ts b{color:var(--txt)}
 #tut .tskip{margin-top:9px;font-size:10.5px;font-weight:800;color:#6b7186;
   background:none;border:none;text-decoration:underline;cursor:pointer}

 /* ── 모달 ── */
 #ov{position:fixed;inset:0;z-index:80;background:rgba(8,9,14,.8);backdrop-filter:blur(3px);
   display:none;align-items:center;justify-content:center;padding:16px}
 /* 바텀시트 — 바깥을 누르면 닫힌다 */
 #ov.bottom{align-items:flex-end;padding:0}
 #ov.bottom #sheet{max-width:440px;width:100%;border-radius:20px 20px 0 0;padding:16px 14px
   calc(14px + env(safe-area-inset-bottom));animation:sheetUp .26s cubic-bezier(.22,.9,.3,1)}
 #ov.bottom #sheet::before{content:'';display:block;width:38px;height:4px;border-radius:99px;
   background:#3d4459;margin:-4px auto 10px}
 @keyframes sheetUp{from{transform:translateY(100%)}}
 #ov.on{display:flex}
 #sheet{width:100%;max-width:400px;max-height:88dvh;overflow-y:auto;
   background:linear-gradient(180deg,#20232f,#171923);border:1px solid var(--line);
   border-radius:16px;padding:16px 15px}
 .big{font-size:19px;font-weight:900;margin:0 0 3px;letter-spacing:-.02em}
 .sub{font-size:12px;color:var(--dim);margin:0 0 13px;line-height:1.5}
 .mbtn{width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:900;margin-top:7px;
   background:linear-gradient(180deg,#f0e6c8,#e0c98a);color:#2a1f00}
 .mbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:13px}
 .mbtn:disabled{opacity:.4}
 /* 사냥터 목록 — 한 화면에 3~4개만. 8개를 욱여넣으면 이름이 9px 로 눌린다 */
 .stlist{display:flex;flex-direction:column;gap:8px;max-height:60dvh;overflow-y:auto;
   margin-bottom:8px;padding-right:6px}
 .strow{display:block;padding:12px 12px 10px;border-radius:14px;
   background:var(--pnl);border:1px solid var(--line)}
 .sth{display:flex;align-items:center;gap:9px;margin-bottom:9px}
 .stno{flex:0 0 auto;min-width:32px;text-align:center;background:#2b3145;color:#cfd4e4;
   font-size:15px;font-weight:900;padding:4px 8px;border-radius:9px}
 .stnm{flex:1;min-width:0;font-size:18px;font-weight:900;letter-spacing:-.03em;
   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .stpets{flex:0 0 auto;display:flex;align-items:center}
 .stpets svg{margin-left:-6px}
 .stlock{font-size:11.5px;font-weight:800;color:#ffb454;margin:-4px 0 8px}
 .strow.sel .stno{background:var(--gold);color:#2a1f05}
 .strow .lootrail{margin-bottom:0;gap:6px}
 .lcd.sm{flex:0 0 66px;padding:6px 3px 7px}
 .lcd.sm i{font-size:8.5px}
 .lcd.sm em{font-size:21px;margin:2px 0 1px}
 .lcd.sm b{font-size:10px}
 .lcd.sm u{font-size:12px}
 .lcd.hit{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,209,102,.45)}
 .strow.lock{opacity:.45}
 .strow.hi{border-color:#8a7bf0;background:linear-gradient(180deg,#2c2748,#221e3a);box-shadow:0 0 0 1px #8a7bf055}
 .strow.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,209,102,.35)}
 .strow .nd{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:8px;height:8px;
   border-radius:99px;background:var(--hot);box-shadow:0 0 0 2px #171923}
 .strow{position:relative}
 .sbp .nd2{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--hot);
   margin-left:4px;vertical-align:1px}
 .mat.tap:active{transform:scale(.95)}
 .fchips{display:flex;gap:5px;margin:9px 0 8px}
 .fc{flex:1;padding:7px 2px;border-radius:9px;font-size:10.5px;font-weight:900;
   background:#20242f;border:1px solid var(--line);color:#8b90a3;white-space:nowrap}
 .fc.on{color:#fff}
 .fc u{display:block;font-size:8.5px;color:#6b7186;text-decoration:none;font-weight:800}
 .fc:active{transform:translateY(1px)}
 .mtabs{display:flex;gap:5px;margin:9px 0 7px}
 .mtab{position:relative;flex:1;padding:9px 3px;border-radius:10px;font-size:11.5px;font-weight:900;
   background:#20232f;border:1px solid var(--line);color:#8a91a8;white-space:nowrap}
 .mtab.on{background:linear-gradient(180deg,#2f3550,#242a40);color:#fff;border-color:#4a5273;
   box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
 .mtab .rd{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:99px;
   background:var(--hot);box-shadow:0 0 0 2px #1b1e29}
 /* 탭을 바꿔도 팝업이 들썩이지 않도록 본문 높이를 고정한다 */
 .shbody{height:46dvh;overflow-y:auto;overscroll-behavior:contain;padding-right:7px;margin-bottom:8px}
 .shbody .sec:first-child{margin-top:2px}
 .card.dim{opacity:.62}
 /* 토스트를 타고 들어온 카드 — 두 번 반짝이고 조용해진다 */
 .card.hlc{border-color:var(--gold);animation:hlc 1.3s ease-in-out 2}
 /* 퀘스트 칩을 타고 들어왔을 때 짚어 주는 테두리. 만질 때까지 계속 번쩍인다.
    outline 은 레이아웃을 안 밀어서 카드 크기가 그대로다 */
 .qhl{position:relative;z-index:3;outline:2.5px solid var(--gold);outline-offset:-1px;
   animation:qhl 1.05s ease-in-out infinite}
 @keyframes qhl{
   0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.50), 0 0 12px 1px rgba(255,209,102,.22);
           outline-color:rgba(255,209,102,1)}
   50%    {box-shadow:0 0 0 8px rgba(255,209,102,0),  0 0 24px 7px rgba(255,209,102,.42);
           outline-color:rgba(255,209,102,.45)}}
 @keyframes hlc{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.0)}
   50%{box-shadow:0 0 0 3px rgba(255,209,102,.45)}}
 .card.empty{text-align:center;color:var(--dim);font-size:11.5px;padding:13px}
 .lockcard{opacity:.5;border-style:dashed}
 .miss{margin-left:6px;font-size:9.5px;font-weight:900;color:#ffb454}

<script>
/* ══ DATA ══ 표는 data.js 로 분리했다 — 여기엔 S 를 참조하는 파생값만 남는다 */
function gradeT(st){                                  // 그 등급 구간 안에서의 진도 0~1
  const g=gradeOf(st), a=GRADE_AT[g], b=GRADE_AT[g+1]||51;
  return b-a<=1 ? 1 : Math.min(1,(st-a)/(b-a-1));
}
const guestsOn = () => { const o=GUEST.filter(g=>S.pets[g.fav]>0 && shopLv()>=g.at); return o.length?o:[GUEST[0]] };
/* 조건이 차면 '영입 가능'이 되고, 실제 합류는 플레이어가 누른다.
   저절로 늘어난 식구는 기억에 안 남는다 — 한 번은 직접 데려와야 한다 */
const petReady = () => LK.filter(k=>!S.pets[k] && petOn(k));
function petJoin(){
  /* 탭 순서는 매장 → 재료 → 상점 → 알바몬 → 도감이다.
     빨강 합류(매장 Lv3)가 재료 탭보다 먼저 오면 순서가 뒤집혀서,
     재료가 뭔지도 모르는 유저에게 알바몬 탭이 먼저 열린다 — 재료 뒤로 미룬다 */
  if(!NAV_ON('bag')) return;
  for(const k of petReady()){
    if(S.pav && S.pav[k]) continue;
    (S.pav = S.pav || {})[k] = 1;
    setTimeout(()=>banner(`🐾 ${LINE[k].pet} 영입 가능!`, '알바몬 탭에서 데려오세요'), 600);
    unlockNav('pet');
  }
}
function hirePet(k){
  if(S.pets[k] || !petOn(k)) return;
  S.pets[k]=1; petSel=k; initStaff(); save(); draw(); SFX('hire');
  banner(`🐾 ${LINE[k].pet} 합류!`, `${LINE[k].n} 조달을 맡습니다`);
}
function shopLv(){ let l=1; while(l<SHOP_MAX && S.fame>=LV_AT[l+1]) l++; return l }
const lvNeed = () => { const l=shopLv(); return l>=SHOP_MAX ? null : { from:LV_AT[l], to:LV_AT[l+1] } };
const FAME_PER_SERVE = (kinds) => (1 + kinds*0.15) * fameMul();
const SEAT_PCT = () => 0.035 * (1 + uLv('lamp')*0.08); // 초당 판매가의 3.5%
/* 착석 호감도 — 납품 1건이 주는 호감도의 몇 배를 '초당' 주느냐.

const SEAT_XP  = () => 0.028 * (1 + uLv('lamp')*0.08);

function pickChat(){ let p=CHAT[0].p; for(const c of CHAT) if(menus().length>=c.at) p=c.p;
  return p[Math.floor(Math.random()*p.length)] }

/* ══ STATE ══ */
const SAVE='alSnackbar_v1';
let S, tab='store', lastTick=0, spawnAcc=1;   // 1 로 시작 = 첫 손님이 첫 프레임에 들어온다
const $=id=>document.getElementById(id);
const now=()=>Date.now();

function fresh(){
  return { gold:0, gem:0, hearts:HEART_MAX, heartAt:now(),
    inv:{b:[0,0,0,0],r:[0,0,0,0],g:[0,0,0,0],y:[0,0,0,0]},
    made:{mr:1}, mlv:{},                   // 주먹밥 하나로 시작한다 / 메뉴 레벨
    up:{seat:1}, pets:{b:1,r:0,g:0,y:0}, best:1,  // 의자 1개로 시작 — 착석을 먼저 보여준다
    t0:now(), sold:{},                     // 첫 실행 시각 / 메뉴별 판매 횟수
    fame:0, miss:{}, missNew:0, huntPick:0, seen:{}, visit:{}, spent:{}, mstar:{}, wish:[],
    items:{del:0,swp:0,rbw:0,up:0,dn:0},       // 매장 경험치 · 놓친 주문
    dexG:{}, dexM:{}, lastSeen:now(), tut:0, pav:{}, hrun:0, clr:{}, served:0, qDone:{},
    nav:{} };   // 하단 탭 해금 — 매장 하나로 시작한다
}
function save(){ try{ S.lastSeen=now(); localStorage.setItem(SAVE, JSON.stringify(S)) }catch(_){} }
function load(){ try{ const r=localStorage.getItem(SAVE); return r?JSON.parse(r):null }catch(_){ return null } }

/* ══ 파생값 ══ */
const uLv    = id => S.up[id]||0;
const menus  = () => MENU.filter(m=>S.made[m.id]);
const petsOn = () => LK.filter(k=>S.pets[k]>0);
function dexMul(){
  let m=1;
  const gp = Object.keys(S.dexG).length/GUEST.length*100;
  const mp = Object.keys(S.dexM).length/16*100;
  for(const t of DEX_TIER){ if(gp>=t.pct) m*=t.mul; if(mp>=t.pct) m*=t.mul; }
  return m;
}
function mileMul(){    // 마일스톤 — '레시피 연구' 축 하나에만 건다.
  // 8축 전부에 곱하면 2^32 까지 튄다(실측). 방치형에서 배수는 한 축으로 모아야 곡선이 읽힌다
  let m=1; const lv=uLv('price');
  for(const k of MILE) if(lv>=k) m*=2;
  return m;
}
const priceMul = () => Math.pow(1.08, uLv('price')) * mileMul() * dexMul();
const cookMul  = () => Math.max(0.25, Math.pow(0.96, uLv('stove')));  // 조리 −4%/lv · 하한 25%
const servMul  = () => (1 + uLv('train')*0.06) * (petsOn().reduce((a,k)=>a+petSpeed(S.pets[k]),0) / Math.max(1,petsOn().length));

function fameBand(){ const l=shopLv(); let b=FAME_BAND[0]; for(const x of FAME_BAND) if(l>=x.at) b=x; return b.w; }
/* 주문 티어는 '그 계열에서 개발한 최고 티어 +1'까지만.
   전역 최고 티어로 자르면 계열 편차 때문에 실망 손님이 30%까지 뜬다(실측) */
function pickTier(line){ const w=fameBand(); let r=Math.random(), a=0, t=0;
  for(let i=0;i<w.length;i++){ a+=w[i]; if(r<a){ t=Math.min(5,i); break } }
  /* ⚠ dev+1 로만 자르면 '아직 해금도 안 된 티어'를 조른다.
     매장 Lv5 에 T2(해금 Lv8)를 찾는 손님이 나오면 개발할 방법 자체가 없다 —
     실망 손님이 산발적으로 터지던 진짜 원인이 여기였다. 해금 티어 안에서만 고른다 */
  return Math.max(0, Math.min(t, capTier(line))); }
/* 그 계열에서 손님이 조를 수 있는 최고 티어. pickTier 와 이론 식이 같은 걸 봐야 한다 */

  const dev = MENU.reduce((m,x)=>(x.line===line && x.tier2>=0 && S.made[x.id])?Math.max(m,x.tier2):m, -1);
  let cap = dev+1;
  while(cap>0 && shopLv() < MENU_LV[cap]) cap--;
  return Math.max(0, cap);
}

/* ⚠⚠ 이 함수는 알바몬을 '레벨업할 때마다' 호출된다.

function initStaff(){
  const on = petsOn();
  const keep = staff.filter(s=>on.includes(s.line));
  if(keep.length===staff.length && keep.length===on.length) return;   // 레벨업뿐 — 그대로 둔다
  const add = on.filter(k=>!keep.some(s=>s.line===k));
  staff = keep.concat(add.map(k=>{
    const i=on.indexOf(k), h=homePos(i);
    return { line:k, st:'idle', t:0, x:h.x, y:h.y, tx:h.x, ty:h.y, mt:0, me:0, path:null, pmul:1, g:null, i, face:'idle' };
  }));
  staff.forEach(s=>{ s.i = on.indexOf(s.line) });                     // 자리 번호만 다시 매긴다
  if(!keep.length) oven={b:[],r:[],g:[],y:[]};                        // 완전 초기화일 때만 화구를 비운다
}
function moveTo(e, p, mul){
  e.path=null; e.tx=p.x; e.ty=p.y; e.me=0;
  e.mt = Math.hypot(p.x-e.x, p.y-e.y) / (SPD*(mul||1));
}
function nextLeg(e){
  const p = e.path && e.path.shift();
  if(!p){ e.path=null; return false }
  e.tx=p.x; e.ty=p.y; e.me=0;
  e.mt = Math.hypot(p.x-e.x, p.y-e.y) / (SPD*e.pmul);
  return true;
}
function movePath(e, ps, mul){ e.pmul=mul||1; e.path=ps.slice(); nextLeg(e) }
function stepMove(e, dt){
  if(e.mt<=0){ if(e.path && e.path.length) return nextLeg(e), false; return true }
  e.me += dt;
  const r = Math.min(1, e.me/e.mt);
  e.x += (e.tx-e.x) * (r>=1?1:dt/Math.max(0.016,e.mt-e.me+dt));
  e.y += (e.ty-e.y) * (r>=1?1:dt/Math.max(0.016,e.mt-e.me+dt));
  if(r>=1){ e.x=e.tx; e.y=e.ty; e.mt=0;
    if(e.path && e.path.length) return nextLeg(e), false;
    e.path=null; return true }
  return false;
}

const fromHall = c  => [ {x:AISLE, y:c.y}, {x:AISLE, y:LY.counter+14}, {x:AISLE, y:ROAD_Y}, {x:-25, y:ROAD_Y} ];

/* 빈 테이블부터 채운다 — 앞자리부터 채우면 1번 테이블만 붐비고 나머지는 논다 */
/* 실제로 놓인 의자의 인덱스만. 격자는 tableCount×chairsPer 인데
   chairsPer 가 올림이라 격자 칸수가 seatTotal 보다 클 수 있다.
   그 차이를 안 걸러서 '정원 5석에 6명'이 앉는 버그가 있었다 */
function seatSlots(){
  const n=chairsPer(), t=tableCount(), cap=seatTotal(), out=[];
  for(let i=0;i<n && out.length<cap;i++)
    for(let j=0;j<t && out.length<cap;j++) out.push(j*n+i);   // 테이블에 고르게 흩는다
  return out;
}
function freeSeat(){
  const used = new Set(guests.filter(g=>g.seat!=null).map(g=>g.seat));
  if(used.size >= seatMax()) return -1;          // 어떤 경우에도 정원을 넘지 않는다
  const n=chairsPer(), cnt={};
  for(const sIdx of used){ const t=Math.floor(sIdx/n); cnt[t]=(cnt[t]||0)+1 }
  let best=-1, bestCnt=99;
  for(const sIdx of seatSlots()){
    if(used.has(sIdx)) continue;
    const c = cnt[Math.floor(sIdx/n)] || 0;
    if(c<bestCnt){ bestCnt=c; best=sIdx }
  }
  return best;
}
/* 줄은 앞이 비면 당겨진다 — 정지된 줄은 죽은 화면처럼 보인다 */
/* 줄 당기기 — 응대 중이거나 실망한 손님은 제자리에 못 박는다.
   같이 당기면 점원이 잡아둔 좌표와 어긋나고(주문 중 이동), 비는 자리에 뒤 손님이 겹쳐 든다 */
const busyGuest = g => !!g.claim || g.st==='order' || g.st==='pend' || g.st==='got' || g.st==='sad';
function compactQueue(){
  const all = guests.filter(g=>g.qi!=null).sort((a,b)=>a.qi-b.qi);
  const held = new Set(); const movers = [];
  for(const g of all){ if(busyGuest(g)) held.add(g.qi); else movers.push(g) }
  let slot = 0;
  for(const g of movers){
    while(held.has(slot)) slot++;
    if(g.qi!==slot){ g.qi=slot; moveTo(g, queuePos(slot), 0.9) }
    held.add(slot); slot++;
  }
  return all.length;
}
function spawnGuest(){
  if(!menus().length) return;
  if(guests.filter(g=>g.qi!=null).length >= queueMax()) return;
  const pool = guestsOn();
  const g  = pool[Math.floor(Math.random()*pool.length)];
  const used = new Set(guests.filter(x=>x.qi!=null).map(x=>x.qi));
  let qi=0; while(used.has(qi)) qi++;              // 빈 슬롯 — length 로 잡으면 겹친다
  const e = { id:++gid, g, st:'in', t:0, wait:0, qi, want:null, seat:null, missName:'', tick:0,
              x: Math.random()<.5?-20:VW+20, y:ROAD_Y, tx:0,ty:0,mt:0,me:0, path:null, pmul:1,
              face:'idle', chat:null, chatT:1.5+Math.random()*2.5 };
  moveTo(e, queuePos(qi), 0.85);
  guests.push(e);
}
function bail(c, why){

/* 주문 결정 — 선호 계열 60% · 티어는 매장 레벨 창에서.
   아직 한 개도 안 연 계열은 30%만 물어본다 — '실망'은 신호여야지 배경음이 되면 안 된다 */
/* 주문 계열은 '합류한 알바몬'이 있는 계열로만 좁힌다.
   안 그러면 매장 Lv1에 노랑 계열(소금빵)을 찾는 손님이 나온다 — 그 알바몬은 Lv15에 온다 */
function decideOrder(fav){
  const own  = LK.filter(k=>S.pets[k]>0);
  const open = own.filter(k=>MENU.some(m=>m.line===k && m.tier2>=0 && S.made[m.id]));
  const pool = open.length?open:(own.length?own:['b']);
  let line = (Math.random()<0.60 && own.includes(fav)) ? fav
           : (own.length?own[Math.floor(Math.random()*own.length)]:'b');
  if(!open.includes(line) && open.length && Math.random()<0.72)
    line = pool[Math.floor(Math.random()*pool.length)];
  /* 그 계열에 아직 파는 게 없으면 60%는 기본 메뉴(주먹밥)로 넘어간다.
     100% 넘기면 '없는 메뉴를 찾는' 사건이 영영 안 생기고,
     0%면 매장 Lv1 에서 아무것도 못 팔아 첫 5분이 빈 화면이 된다 */
  /* 알바몬은 넷인데 개발한 계열은 하나뿐인 구간이 길다.
     그 계열 손님이 올 때마다 실망시키면 토스트만 쌓인다 — 대부분 기본 메뉴로 넘긴다 */
  if(!open.includes(line) && S.made[BASIC.id] && Math.random()<0.82)
    return { basic:true };
  return { line, tier: pickTier(line) };
}
function stepShop(dt){
  const cl=$('closed');
  if(!menus().length){ if(cl) cl.classList.add('on'); return }
  if(cl) cl.classList.remove('on');

  spawnAcc += dt*spawnPS();
  while(spawnAcc>=1){ spawnAcc--; spawnGuest(); }
  compactQueue();

  /* ── 손님 : 줄 → 주문 → 수령 → (빈자리 있으면 착석 보너스) → 퇴장 ── */
  for(const c of guests){
    stepMove(c, dt);
    /* 유령 방어 — 담당 알바몬이 사라진 손님은 아무도 안 부르므로 영원히 남고
       대기열 한 칸이 죽는다. 어떤 경로로 생기든 45초를 넘기면 스스로 나간다 */
    if(c.st==='pend' || c.st==='order'){
      c.pt=(c.pt||0)+dt;
      if(c.pt>45 && !staff.some(st=>st.g===c)){
        c.qi=null; c.pi=null; c.seat=null; c.st='out'; moveTo(c, exitPos(c), 0.75); continue }
    } else c.pt=0;
    switch(c.st){
      case 'in':
        if(c.mt<=0) c.st='queue';
        break;
      case 'queue':                                    // 말풍선 없음 · 숨쉬기
        c.wait += dt;
        if(c.wait>28 && !c.claim) bail(c, '기다리다 감');
        break;
      case 'sad':
        c.t += dt;
        if(c.t>=3 && c.mt<=0){ c.qi=null; c.pi=null; c.seat=null; c.st='out'; moveTo(c, exitPos(c), 0.75) }
        break;
      case 'got':                                      // ♥ 말풍선
        c.t += dt;
        if(c.t>=1.0){
          c.qi=null;
          const sIdx = freeSeat();                     // 자리가 있으면 앉는다 · 없으면 그냥 간다
          if(sIdx>=0){ c.seat=sIdx; c.st='toSeat'; movePath(c, toHall(seatPos(sIdx)), 0.75) }
          else { c.st='out'; moveTo(c, exitPos(c), 0.75) }
        }
        break;
      case 'toSeat':
        if(c.mt<=0 && !c.path){ c.st='seated'; c.t=0; c.tick=Math.random()*1.8; c.face='eat';
          /* 첫 손님이 앉는 순간에만. '의자를 사라'고 하기 전에 왜 사는지를 본다 */
          if(!S.sawSeat){ S.sawSeat=1; save();
            banner('🪑 앉아서 먹어요',
              '자리가 있으면 앉아서 먹고 갑니다<br>앉은 손님은 <b>골드와 호감도를 계속</b> 더 줘요',
              true, ()=>{ S.seatTip=1; save(); qLast=''; }); } }
        break;
      case 'seated': {                                 // 초당 골드 + 경험치 — 띠링띠링
        c.t += dt; c.tick += dt; c.chatT -= dt;
        if(c.tick>=SEAT_TICK){
          c.tick-=SEAT_TICK;
          /* 초반 주먹밥(5G)은 3.5%×1.8초가 0.3 이라 반올림하면 0이 뜬다.
             '앉으면 이득'이라고 해놓고 +0 을 보여주면 그 말이 거짓이 된다 */
          const g  = Math.max(1, Math.round(menuPrice(c.want) * SEAT_PCT() * SEAT_TICK));
          const xp = FAME_PER_SERVE(menus().length) * SEAT_XP() * SEAT_TICK
                     * STAR_XP[mStar(c.want)];
          S.gold += g; S.fame += xp;
          SFX('seat');
          fx(g, false, c.x, c.y-6, 1, xp);
        }
        if(c.chatT<=0){
          if(c.chat){ c.chat=null; c.chatT=1.4+Math.random()*2.2 }
          else { c.chat=pickChat(); c.chatT=1.9 }
        }
        if(c.t>=SEAT_SEC){ c.chat=null; c.seat=null; c.face='happy'; c.st='out'; movePath(c, fromHall(c), 0.75) }
        break; }
      case 'out':
        if(c.mt<=0 && !c.path) c.dead=1;
        break;
    }
  }
  guests = guests.filter(c=>!c.dead);

  /* ── 점원(알바몬) : 카운터 밖으로 나가지 않는다 ── */
  for(const st of staff){
    const done = stepMove(st, dt);
    switch(st.st){
      case 'idle': {
        const c = guests.find(x=>x.st==='queue' && !x.claim);
        if(c){ c.claim=st; st.g=c; st.st='goOrder'; moveTo(st, orderPos(c), walkMul()) }
        break; }
      case 'goOrder':
        if(Math.abs(st.tx-st.g.x)>2) moveTo(st, orderPos(st.g), walkMul());   // 줄이 당겨지면 재조준
        else if(done){ st.st='taking'; st.t=0; st.g.st='order' }
        break;
      case 'taking': {
        st.t += dt;
        if(st.t < Math.max(0.55, 0.9/servMul())) break;
        const c=st.g, o=decideOrder(c.g.fav);
        const m = o.basic ? BASIC : (menuOf(o.line, o.tier) || menuOf(o.line, 0));
        c.want = m;
        if(!m || !S.made[m.id]){                       // 못 파는 메뉴 → 실망 3초 뒤 이탈
          bail(c, m ? m.name : '?');
          if(m){ const n=(S.miss[m.id]=(S.miss[m.id]||0)+1); S.missNew=1;
            /* 토스트는 폐지. 3회 이상 찾은 메뉴만 가이드 퀘스트로 승격된다 —
               1회 스침까지 띄우던 게 토스트가 쌓여 화면을 덮던 원인이었다 */
            if(!S.wish.includes(m.id)) S.wish.push(m.id); }
          st.say='아직 없는 메뉴에요ㅠㅠ'; SFX('sad');  // 손님이 떠날 때까지 제자리에서 사과한다
          st.st='sorry'; st.t=0;
          break;
        }
        c.st='pend';                                   // 메뉴 말풍선 — 줄에 그대로 선다
        /* 빈 화구가 있으면 중간 경유 없이 그 슬롯으로 직행한다 */
        { const sl=takeOven(m.line);
          if(sl>=0){ st.oven=m.line; st.slot=sl; st.st='toOven'; moveTo(st, workPos(m.line,sl), walkMul()) }
          else { st.st='goCook'; moveTo(st, sidePos(m.line, st.i), walkMul()) } }
        break; }
      case 'goCook':
        if(done) st.st='waitOven';
        break;
      case 'waitOven': {
        const ln=st.g.want.line, sl=takeOven(ln);
        if(sl>=0){ st.oven=ln; st.slot=sl; st.st='toOven'; moveTo(st, workPos(ln,sl), walkMul()) }
        break; }
      case 'toOven':
        if(done){ st.st='cooking'; st.t=0 }
        break;
      case 'cooking': {
        st.t += dt;
        // 전달 텀 하한 0.9초 — 더 빠르면 주문 말풍선이 한 프레임 뜨고 사라진다
        const need = Math.max(0.9, (st.g.want.cookMs/1000)*cookMul()/servMul());
        if(st.t>=need){ freeOven(st.oven, st.slot); st.oven=null; st.slot=null;
          st.st='goServe'; moveTo(st, orderPos(st.g), walkMul()) }
        break; }
      case 'goServe':
        if(Math.abs(st.tx-st.g.x)>2) moveTo(st, orderPos(st.g), walkMul());
        else if(done){ st.st='serving'; st.t=0 }
        break;
      case 'serving': {
        st.t += dt;
        if(st.t<0.3) break;
        const c=st.g, fav=c.g.fav===c.want.line;
        let earn = menuPrice(c.want) * (fav?1.5:1);
        if(Math.random()<tipRate()) earn += Math.round(earn*0.3);
        const xp = FAME_PER_SERVE(menus().length) * STAR_XP[mStar(c.want)];
        S.gold += earn;
        S.fame += xp;
        SFX('coin'); if(fav) SFX('happy');
        S.served=(S.served||0)+1;
        (S.sold=S.sold||{})[c.want.id]=(S.sold[c.want.id]||0)+1;
        S.dexG[c.g.k]=1;
        S.visit[c.g.k]=(S.visit[c.g.k]||0)+1;                 // 도감 통계
        S.spent[c.g.k]=(S.spent[c.g.k]||0)+earn;
        fx(earn, fav, c.x, c.y, 0, xp);
        c.st='got'; c.t=0; c.face='happy'; c.claim=null;
        st.g=null; st.st='goHome'; moveTo(st, homePos(st.i), walkMul());
        break; }
      case 'sorry':                                    // 손님이 떠날 때까지 제자리
        if(!st.g || st.g.dead || st.g.st==='out'){
          st.say=null; st.g=null; st.st='goHome'; moveTo(st, homePos(st.i), walkMul());
        }
        break;
      case 'goHome':
        if(done) st.st='idle';
        break;
    }
  }
  petJoin();
  /* 매장 레벨업 — 이 게임의 목표축이라 소리로도 크게 알린다 */
  const lvNow=shopLv();
  if(S._lv!=null && lvNow>S._lv) SFX('lvup');
  S._lv=lvNow;
  /* 새 손님 등장 — 사건으로 알린다 */
  const on=guestsOn().length;
  if(S._gn!=null && on>S._gn){
    const nw=guestsOn()[on-1];
    banner(`새 손님 · ${nw.n}`, `${LINE[nw.fav].n}${josa2(LINE[nw.fav].n,'을','를')} 좋아합니다`);
    if(on>=2) unlockNav('dex');              // 모을 게 둘이 돼야 '도감'이 의미를 가진다
  }
  S._gn=on;
}

  /* 'defer' — 탭만 열고 설명은 미룬다. 해금하자마자 팝업을 띄우면
     "이 탭을 눌러라"와 "이 탭은 이런 곳이다"가 한꺼번에 와서 둘 다 안 읽힌다.
     유저가 직접 눌러 들어온 다음에 설명하는 편이 순서가 맞는다 */
  if(jump==='defer'){ (S.navWait = S.navWait || {})[id]=1; save(); return }

/* 배너는 한 장씩 줄을 세운다. 두 개가 겹치면 둘 다 못 읽고,
   모달이 열려 있으면 그 위를 덮으니 닫힐 때까지 기다린다 */
let bnrQ=[], bnrOn=0;
/* hold=true 면 자동으로 안 사라진다. 처음 배우는 규칙은 1.7초 안에 못 읽는다 —
   읽고 탭할 때까지 기다렸다가, 닫히는 순간 다음 안내로 이어 준다 */
function banner(t, sub, hold, after){ bnrQ.push([t,sub,hold,after]); bnrNext() }
function bnrNext(){
  if(bnrOn || !bnrQ.length) return;
  if(document.body.classList.contains('ovon') || document.body.classList.contains('inpuz'))
    return void setTimeout(bnrNext, 600);
  bnrOn=1;
  const [t,sub,hold,after]=bnrQ.shift();
  const b=document.createElement('div'); b.id='bnr';
  b.innerHTML=`<div class="bt">${t}</div>${sub?`<div class="bs">${sub}</div>`:''}`
            + (hold?`<div class="bx">탭해서 닫기</div>`:'');
  document.body.appendChild(b);
  const close=()=>{ b.classList.add('out');
    setTimeout(()=>{ b.remove(); bnrOn=0; if(after) try{ after() }catch(_){}; bnrNext() }, 420) };
  if(hold){ b.classList.add('hold');
    b.addEventListener('pointerdown', e=>{ e.stopPropagation(); close() }, {once:true});
    setTimeout(()=>document.addEventListener('pointerdown', close, {once:true}), 400);
  } else setTimeout(close, 1700);
}

  const y=$('stage'); if(!y) return;

  e.innerHTML = txt ? `<span class="fg">${txt}</span>`

/* ══ 오프라인 정산 ══ */
function offline(){
  const el = Math.min((now()-(S.lastSeen||now()))/1000, idleCapH()*3600);
  if(el<60 || !menus().length) return 0;
  S.fame += fameRate() * el * 0.6;                                   // 오프라인은 60%만
  return Math.floor(offlineRate()*el);
}

/* ══ 숫자 ══ */
const SUF=['','K','M','B','T','aa','ab','ac','ad','ae'];
function fmt(n){
  n=Math.floor(n); if(n<1000) return String(n);
  let i=0; while(n>=1000 && i<SUF.length-1){ n/=1000; i++; }
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+SUF[i];
}

function canMakeAny(){ return MENU.some(m=>!S.made[m.id] && menuUnlocked(m) && canMake(m)); }
/* 등급은 상위호환 — 높은 등급이 낮은 등급 자리를 메운다.
   안 그러면 상위 사냥터만 도는 순간 하급 재료가 말라 중간 메뉴가 영구 잠긴다(실측: 채소 그라탱) */
function canMake(m){
  return LK.every(k=>{
    let sur=0;
    for(let g=3; g>=0; g--){ sur += (S.inv[k][g]||0) - m.cost[k][g]; if(sur<0) return false; }
    return true;
  });
}
const haveAt=(k,g)=>{ let n=0; for(let i=g;i<4;i++) n+=(S.inv[k][i]||0); return n };  // 상위호환 보유량
function payMat(m){                       // 낮은 등급부터 소모 — 고급 재료를 아낀다
  LK.forEach(k=>{
    for(let g=0; g<4; g++){
      let need=m.cost[k][g];
      for(let s=g; s<4 && need>0; s++){ const t=Math.min(need, S.inv[k][s]||0); S.inv[k][s]-=t; need-=t; }
    }
  });
}

/* ── 빈 슬롯 고스트 ────────────────────────────────────────────
   살 수 있는 설비의 '실제 자리'를 점선으로 미리 그려 둔다.
   목록에서 "의자 +1"을 읽는 것보다 빈 자리가 깜빡이는 게 훨씬 빠르다.
   살 수 있으면 금색 점멸, 골드가 모자라면 회색 정적 */
function svgGhosts(){
  let h='';
  const canBuy = id => { const u=UPG.find(x=>x.id===id);
    return u && upUnlocked(u) && uLv(id)<u.max && S.gold>=upCost(u,uLv(id)) };
  const show   = id => { const u=UPG.find(x=>x.id===id); return u && upUnlocked(u) && uLv(id)<u.max };
  /* 의자 — 다음에 놓일 자리 하나만 */
  if(show('seat') && seatTotal()<tableCount()*8){
    const p=seatPos(seatTotal());
    h+=`<g class="gh ${canBuy('seat')?'able':''}" onclick="ghostBuy('seat')">
      <ellipse cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" rx="12" ry="9"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y+4).toFixed(1)}">＋</text></g>`;
  }
  /* 테이블 — 다음 테이블 자리 */
  if(show('table') && tableCount()<4){
    const t=tablePos(tableCount());
    h+=`<g class="gh ${canBuy('table')?'able':''}" onclick="ghostBuy('table')">
      <ellipse cx="${t.x}" cy="${t.y}" rx="34" ry="22"/>
      <text x="${t.x}" y="${t.y+6}" style="font-size:17px">＋</text></g>`;
  }
  /* 보조 화구 — 열린 화로 옆 */
  if(show('burner')){
    const o=wtOpen(); if(o.length){
      const x=WT_X[wtOrder().indexOf(o[o.length-1])]+46;
      h+=`<g class="gh ${canBuy('burner')?'able':''}" onclick="ghostBuy('burner')">
        <rect x="${x-16}" y="${LY.work+8}" width="32" height="32" rx="7"/>
        <text x="${x}" y="${LY.work+30}">＋</text></g>`;
    }
  }
  /* 화로 배지 — 그 계열에 지금 할 수 있는 메뉴 액션 */
  for(const k of wtOpen()){
    const x=WT_X[wtOrder().indexOf(k)];
    const star = menus().some(m=>m.line===k && canStar(m));
    const make = MENU.some(m=>m.line===k && !S.made[m.id] && menuUnlocked(m) && canMake(m));
    const lvup = menus().some(m=>m.line===k && (S.mlv[m.id]||0)<mLvCap(m) && S.gold>=mLvCost(m));
    const b = star?['✨','up']:make?['＋','new']:lvup?['⬆','lv']:null;
    if(!b) continue;
    h+=`<g class="wbadge ${b[1]}" onclick="badgeTap('${k}','${b[1]}')">
      <circle cx="${x}" cy="${LY.work-16}" r="13"/>
      <text x="${x}" y="${LY.work-11}">${b[0]}</text></g>`;
  }
  return h;
}

function svgTable(x,y,n){                   // 원형 테이블 + 의자 n개 (뒤쪽 의자는 테이블 뒤로)

    const a=(-90+i*(360/n))*Math.PI/180, cy=Math.sin(a)*33+10;
    if(d==='back' ? cy>=8 : cy<8) return '';
    const cx=(Math.cos(a)*50).toFixed(1);
    return `<rect x="${cx-8}" y="${cy-13}" width="16" height="12" rx="4" fill="#b07a92"/>
            <ellipse cx="${cx}" cy="${cy.toFixed(1)}" rx="10" ry="7" fill="#c98fa8"/>
            <ellipse cx="${cx}" cy="${(cy-3).toFixed(1)}" rx="10" ry="5.5" fill="#dda3ba"/>`;
  }).join('');
  return `<g transform="translate(${x},${y})">
    <ellipse cx="0" cy="16" rx="44" ry="13" fill="#000" opacity=".2"/>
    ${ch('back')}
    <ellipse cx="0" cy="8" rx="30" ry="13" fill="#7d5f47"/>

    <ellipse cx="0" cy="-5" rx="25" ry="11.5" fill="#cfa47c" opacity=".65"/>
    ${ch('front')}</g>`;
}

/* ── 관리 팝업 공통 골격 ────────────────────────────────────────
   매장 관리 · 메뉴 관리 두 화면이 같은 문법을 쓴다:
     [헤더 = 매장 레벨] → [고정 탭] → [고정 높이 본문·스크롤] → [닫기]
   본문 정렬은 셋 다 동일: 지금 가능 → 조건 미달 → 잠김 티저 1개 */
function sheetFrame(title, sub, tabs, body){
  return `<p class="big">${title}</p><p class="sub">${sub}</p>
    <div class="mtabs">${tabs}</div>
    <div class="shbody scr">${body}</div>
    <button class="mbtn ghost" onclick="ovClose()">닫기</button>`;
}
function lvHead(){
  const lv=shopLv(), nd=lvNeed();
  return `매장 <b style="color:var(--gold)">Lv.${lv}</b>`
    + (nd?` · 다음 레벨까지 ${Math.ceil(nd.to-S.fame).toLocaleString()}`:' · MAX')
    + ` · 보유 ${G(S.gold)}`;
}
/* 다음에 열릴 것 하나만 티저로 — 전부 보여주면 정보 과부하가 된다 */
function teaser(ic, name, lv, extra){
  return `<div class="card lockcard"><div class="row"><div class="ic">🔒</div>
    <div class="tx"><div class="nm">${ic} ${name}</div>
      <div class="ds">매장 <b style="color:var(--gold)">Lv.${lv}</b> 도달 시 해금${extra||''}</div></div></div></div>`;
}

let mngTab='hall';
function setMng(t){ mngTab=t; openManage() }
function openManage(){
  const inCat = UPG.filter(u=>u.cat===mngTab);
  const open  = inCat.filter(upUnlocked);
  const next  = inCat.filter(u=>!upUnlocked(u)).sort((a,b)=>a.lv-b.lv)[0];
  const rank  = u => (uLv(u.id)>=u.max ? 2 : (S.gold>=upCost(u,uLv(u.id)) ? 0 : 1));
  const cnt = c => UPG.filter(u=>u.cat===c && upUnlocked(u) && S.gold>=upCost(u,uLv(u.id)) && uLv(u.id)<u.max).length;
  const tabs = UCAT.map(c=>`<button class="mtab ${mngTab===c.k?'on':''}" onclick="setMng('${c.k}')">
    ${c.n}${cnt(c.k)?'<i class="rd"></i>':''}</button>`).join('');
  const body = open.sort((a,b)=>rank(a)-rank(b)).map(u=>{
      const lv=uLv(u.id), mx=lv>=u.max, c=upCost(u,lv), able=S.gold>=c&&!mx;
      return `<div class="card" data-up="${u.id}"><div class="row"><div class="ic">${u.ic}</div>
        <div class="tx"><div class="nm">${u.n}<span class="lv">Lv.${lv}${mx?' MAX':' / '+u.max}</span></div>
          <div class="ds">${u.d}${u.id==='price'&&MILE.includes(lv+1)?' · <b style="color:var(--gold)">다음 레벨 ×2</b>':''}</div></div>
        <button class="buy ${able?'able':''}" ${mx?'disabled':''} onclick="buyUp('${u.id}');openManage()">${mx?'MAX':G(c)}</button>
      </div></div>`}).join('')
    + (next ? teaser(next.ic, next.n, next.lv, ' · '+next.d) : '');
  $('sheet').innerHTML = sheetFrame('🔧 매장 관리', lvHead(), tabs, body);
  $('ov').classList.add('on'); document.body.classList.add('ovon');
  if(hlSel) hlPaint();
}

/* ── 메뉴 관리(매장 화면) : 이미 파는 메뉴를 골드로 강화하는 곳.
   개발은 재료 탭의 '메뉴 개발'이 맡는다 — 두 화면이 같은 목록을 보여주면 어느 쪽이 정본인지 흐려진다 */
let menuTab='b';
function setMenuTab(t){ menuTab=t; openMenuMng() }
let hlMenu=null;                       // 토스트를 타고 들어왔을 때 짚어 줄 메뉴
function openMenuMng(hl){
  S.missNew=0; hlMenu = hl || null;
  const inLine = MENU.filter(m=>m.line===menuTab);
  const sold   = inLine.filter(m=>S.made[m.id]);
  const missN  = k => MENU.filter(m=>m.line===k && S.miss[m.id]).length;
  const tabs = LK.map(k=>`<button class="mtab ${menuTab===k?'on':''}" onclick="setMenuTab('${k}')"
    style="${menuTab===k?`border-color:${LINE[k].col}88`:''}">
    <span style="color:${LINE[k].col}">●</span> ${LINE[k].n}${missN(k)?'<i class="rd"></i>':''}</button>`).join('');

  const star = m => `<span class="stars">${[0,1,2].map(i=>
    `<b class="${i<=mStar(m)?'on':''}">★</b>`).join('')}</span>`;
  let body = sold.length ? sold.map(m=>{
      const lv=S.mlv[m.id]||0, cap=mLvCap(m), full=lv>=cap, c=mLvCost(m);
      const canS=canStar(m), maxed=mStar(m)>=STAR_MAX-1;
      return `<div class="card" data-mid="${m.id}"><div class="row">
        <div class="ic" style="background:${LINE[m.line].col}22">🍽</div>
        <div class="tx"><div class="nm">${m.name}${star(m)}<span class="lv">Lv.${lv}/${cap}</span></div>
          <div class="ds">${STAR_NAME[mStar(m)]} · 판매가 ${G(menuPrice(m))}
            ${full?'':`<span style="color:var(--ok)"> → ${G(Math.round(menuPrice(m)*(1+(lv+1)*0.08)/(1+lv*0.08)))}</span>`}</div></div>
        ${full && !maxed
          ? `<button class="buy able" onclick="ovClose();openDev('store')">✨ 개선</button>`
          : `<button class="buy ${(!full&&S.gold>=c)?'able':''}" onclick="lvMenu('${m.id}');openMenuMng()">${full?'MAX':G(c)}</button>`}
      </div></div>`}).join('')
    : `<div class="card empty">이 계열은 아직 파는 메뉴가 없습니다<br>
        <span style="font-size:10.5px"><b>메뉴 개발</b>에서 만들 수 있어요</span></div>`;
  /* 손님이 찾는데 아직 없는 메뉴 — 여기서 바로 개발하거나 수급처를 본다 */
  const wish = inLine.filter(m=>!S.made[m.id] && S.miss[m.id]);
  if(wish.length){
    body += `<div class="wsep"><span>손님이 찾는 메뉴</span></div>`;
    body += wish.sort((a,b)=>(canMake(b)-canMake(a))||(S.miss[b.id]-S.miss[a.id])).map(m=>{
      const ok=canMake(m)&&menuUnlocked(m);
      return `<div class="card ${ok?'':'dim'}" data-mid="${m.id}"><div class="row">
        <div class="ic" style="background:${LINE[m.line].col}22">🍳</div>
        <div class="tx"><div class="nm">${m.name}<span class="miss">🥲 ${S.miss[m.id]}회 놓침</span></div>
          <div class="ds">${menuUnlocked(m)?'재료만 있으면 바로 개발':`매장 Lv.${MENU_LV[m.tier2]} 도달 시 개방`}</div></div>
        <button class="buy ${ok?'able':''}" onclick="${ok?`make('${m.id}');openMenuMng()`:`needInfo('${m.id}')`}">${ok?'개발':'상세'}</button>
      </div></div>`}).join('');
  }
  const undone = inLine.filter(m=>!S.made[m.id] && !S.miss[m.id]).length;
  if(undone) body += `<div class="card lockcard"><div class="row"><div class="ic">🍳</div>
    <div class="tx"><div class="nm">미개발 ${undone}종</div>
      <div class="ds"><b>메뉴 개발</b>에서 만듭니다</div></div>
    <button class="buy able" onclick="openDev()">개발</button></div></div>`;
  $('sheet').innerHTML = sheetFrame(DISH_SVG+' 메뉴 관리', lvHead()+' · 판매 중 '+menus().length+'/'+MENU.length, tabs, body);
  $('ov').classList.add('on'); document.body.classList.add('ovon');
  /* 토스트를 타고 들어왔으면 그 카드로 스크롤하고 잠깐 반짝인다 —
     목록이 길면 "어느 걸 보라는 건지"가 안 읽힌다 */
  if(hlMenu){
    const el=$('sheet').querySelector(`[data-mid="${hlMenu}"]`);
    if(el){ setTimeout(()=>{ el.scrollIntoView({block:'center'}); el.classList.add('hlc') }, 60);
            setTimeout(()=>el.classList.remove('hlc'), 2800); }
    hlMenu=null;
  }
  if(hlSel) hlPaint();
}
/* ── 메뉴 개선 ★1~★3 ────────────────────────────────────────────
   골드 레벨업은 20레벨에서 막히고, 그 위는 재료를 태워야 열린다.
   골드는 방치로 저절로 쌓이고 재료는 퍼즐로만 나온다 —
   두 자원이 번갈아 병목이 되어야 "골드는 남는데 못 올린다 → 사냥 가자"가 성립한다 */
const STAR_MAX  = 3;
const LV_PER_STAR = 20;
const STAR_NAME = ['그냥 만든','손맛 든','소문난'];
const STAR_MUL  = [1, 2.2, 5];          // 판매가
const STAR_XP   = [1, 1.6, 2.6];        // 호감도
const mStar   = m => S.mstar?.[m.id] || 0;
const mLvCap  = m => (mStar(m)+1) * LV_PER_STAR;
const mLvCost = m => {
  const lv=S.mlv[m.id]||0;
  const c=Math.ceil((m.price*2.2) * Math.pow(1.22, lv) * (1-Math.min(.5,uLv('note')*0.03)));
  /* 주먹밥 첫 강화만 반값. 첫 퀘스트가 '골드가 모이면' 뜨는 구조라
     이 문턱이 곧 튜토리얼 시작 시각이다 — 11G 면 20초, 6G 면 8초쯤 */
  return (lv===0 && m.basic) ? Math.max(3, Math.round(c*0.4)) : c;
};
/* 개선 재료 — 등급이 오를수록 상위 등급을 요구해서 재료가 계속 소비된다 */
/* 개선 비용 — 실측에서 재료가 후반에 500개씩 남아돌았다(사냥할 이유가 사라진다).
   ★2는 재료 ×22, ★3은 ×22 + 상위 등급 24 — 3막 내내 사냥터를 돌아야 채워진다 */
function starCost(m){
  const st=mStar(m), need=[], mul=[22,22][st]||22;
  LK.forEach(k=>m.cost[k].forEach((q,g)=>{ if(q>0) need.push({k,g,q:q*mul}) }));
  if(st>=1) need.push({ k:m.line, g:Math.min(3,1+st), q:24 });
  return need;
}
const canStar = m => !m.basic && mStar(m)<STAR_MAX-1 && (S.mlv[m.id]||0)>=mLvCap(m)
  && starCost(m).every(r=>haveAt(r.k,r.g)>=r.q);
function upStar(id){
  const m=MENU.find(x=>x.id===id); if(!canStar(m)) return;
  for(const r of starCost(m)){ let need=r.q;
    for(let g=r.g; g<4 && need>0; g++){ const t=Math.min(need,S.inv[r.k][g]||0); S.inv[r.k][g]-=t; need-=t } }
  S.mstar[m.id]=mStar(m)+1; save(); draw(); SFX('star');
  toast(`✨ <b>${m.name}</b> · ${STAR_NAME[mStar(m)]} 요리가 되었습니다`);
}

/* ── 재료 탭 : 구해오기(주 액션) + 보유 현황 ── */

/* ── 재료 탭 ──────────────────────────────────────────────────────
   슬라이스 탭 둘로 갈랐다. 한 화면에 사냥터 정보와 재고를 같이 쌓으니
   "지금 뭘 해야 하나"가 안 읽히고 글자만 작아졌다.
   주 액션 버튼은 #view 밖(#botcta)에 둔다 — 탭을 오가도 자리가 안 흔들린다 */
let bagTab = 'hunt';                 // 'hunt' | 'inv'
let devOn  = false;                  // 메뉴 개발 = 바텀시트가 아니라 화면 전환
let devBack = 'bag';                 // 뒤로가기로 돌아갈 곳 (매장에서 들어오면 매장으로)
function setBagTab(t){ bagTab=t; devOn=false; draw() }
function openDev(from){ devBack = from || 'bag'; devOn=true; bagTab='inv'; go('bag') }
function closeDev(){ devOn=false; if(devBack==='store'){ devBack='bag'; go('store') } else draw() }

function viewBag(){
  if(devOn) return viewDev();
  const ready = MENU.filter(m=>!S.made[m.id]&&menuUnlocked(m)&&canMake(m)).length;
  const seg = `<div class="seg">
    <button class="${bagTab==='hunt'?'on':''}" onclick="setBagTab('hunt')">사냥터${newHunt()?'<i></i>':''}</button>
    <button class="${bagTab==='inv'?'on':''}"  onclick="setBagTab('inv')">인벤토리${ready?'<i></i>':''}</button>
  </div>`;
  return seg + (bagTab==='hunt' ? viewHuntTab() : viewInvTab());
}

/* 사냥터 탭 — 그림이 조작 영역이다. 좌우 화살표·스와이프로 사냥터를 넘긴다.
   'S12' 같은 축약은 전부 뺐다. 숫자 하나면 충분하고, 접두사는 읽을 것만 늘린다 */
const curHunt = () => Math.max(1, Math.min(50, S.huntPick||huntMax()||1));
function stepHunt(d){
  const n = curHunt()+d;
  if(n<1 || n>50) return;
  S.huntPick=n; S.seen[n]=1; save(); draw();
}
function viewHuntTab(){
  const cur = curHunt(), info = huntInfo(cur), open = huntOpen(cur);
  const loot = stageLoot(cur).map(it=>`
    <span class="lcd">
      <i style="color:${GCOL[it.g]}">${GRADE[it.g]}</i>
      <em>${MATIC[it.k][it.g]}</em>
      <b>${MAT[it.k][it.g]}</b>
      <u>${it.min===it.max?it.min:it.min+'~'+it.max}</u></span>`).join('');
  const pets = LK.map(k=>{
    const need=recLv(cur,k); if(!need) return '';
    const my=S.pets[k]||0;
    return `<span class="hpet ${my>=need?'ok':'low'}">${PETPAL(k,20,'idle')}
      <b>${my||'-'}</b><u>/ ${need}</u></span>`}).join('');
  return `
    <div class="hcard ${open?'':'lock'}" id="hcard">
      <div class="hbg" style="background-image:url(&quot;${themeBG(cur)}&quot;)"></div>
      <div class="hsh"></div>
      <div class="hbot"><span class="hno">${cur}</span><span class="hnm">${info.name}</span></div>
      <div class="hright">
        <button class="hsel" onclick="openHunt()">사냥터 선택 ›</button>
        <div class="hplab">권장 알바몬<u>보유 Lv / 권장 Lv</u></div>
        <div class="hpets">${pets}</div>
      </div>
      ${cur>1  ? `<button class="harr l" onclick="stepHunt(-1)">‹</button>`:''}
      ${cur<50 ? `<button class="harr r" onclick="stepHunt(1)">›</button>`:''}
    </div>
    ${open?'':`<div class="hlock">🔒 ${huntLock(cur)}</div>`}
    <div class="hsec">획득 가능 재료</div>
    <div class="lootrail scr">${loot}</div>`;
}
/* 스크롤 중에만 스크롤바를 보여준다. 멈추고 0.7초 뒤 다시 사라진다 */
function bindScrollFade(){
  for(const el of document.querySelectorAll('.dexbody')){
    if(el.dataset.sf) continue; el.dataset.sf='1';
    let t=null;
    el.addEventListener('scroll', ()=>{
      el.classList.add('scing');
      clearTimeout(t); t=setTimeout(()=>el.classList.remove('scing'), 700);
    }, {passive:true});
  }
}
/* 스와이프 — 카드 위에서 좌우로 밀면 사냥터가 넘어간다 */
function bindHuntSwipe(){
  const c=$('hcard'); if(!c || c.dataset.sw) return; c.dataset.sw='1';
  let x0=null, y0=null;
  c.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY }, {passive:true});
  c.addEventListener('touchend', e=>{
    if(x0==null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    x0=null;
    if(Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)*1.4) stepHunt(dx<0?1:-1);
  }, {passive:true});
  /* 데스크톱에서도 확인할 수 있게 드래그를 같이 받는다 */
  let mx=null;
  c.addEventListener('pointerdown', e=>{ if(e.pointerType==='mouse') mx=e.clientX });
  c.addEventListener('pointerup',   e=>{ if(mx==null) return;
    const dx=e.clientX-mx; mx=null; if(Math.abs(dx)>44) stepHunt(dx<0?1:-1) });
}

/* 인벤토리 탭 — 훑는 화면이라 밀도가 높은 편이 맞다. 표 형태를 그대로 쓰고
   미획득만 흐리게 눌러 둔다(도감처럼 ??? 로 가리지는 않는다) */
function viewInvTab(){
  return LK.map(k=>`
    <div class="matline">
      <span class="lndot" style="background:${LINE[k].col}"></span>
      <span class="lnnm">${LINE[k].n}</span>
      <span class="mats">${[0,1,2,3].map(g=>{

/* 메뉴 개발 — 바텀시트로는 카드가 못 커진다. 화면을 통째로 쓴다 */
function viewDev(){
  const all  = MENU.filter(m=>!S.made[m.id] && menuUnlocked(m));
  const todo = (devF.length ? all.filter(m=>devF.some(k=>usesLine(m,k))) : all)
                 .sort((a,b)=>(canMake(b)-canMake(a))||(a.tier2-b.tier2));
  const starAll = menus().filter(m=>!m.basic && mStar(m)<STAR_MAX-1 && (S.mlv[m.id]||0)>=mLvCap(m));
  const filt = `<div class="fchips">${LK.map(k=>{
    const on=devF.includes(k);
    const n=all.filter(m=>usesLine(m,k)).length + starAll.filter(m=>usesLine(m,k)).length;
    return `<button class="fc ${on?'on':''}" onclick="toggleDevF('${k}')"
      style="${on?`border-color:${LINE[k].col};background:${LINE[k].col}22`:''}">
      <span style="color:${LINE[k].col}">●</span> ${LINE[k].n}<u>${n}</u></button>`}).join('')}</div>`;
  const cards = todo.map(m=>{
    const ok=canMake(m), n=S.miss[m.id]||0;
    const req=LK.flatMap(k=>m.cost[k].map((q,g)=>q?{k,g,q}:null).filter(Boolean));
    return `<div class="mcard ${ok?'':'dim'}" data-mid="${m.id}" data-kind="dev">
      <div class="mbar" style="background:${LINE[m.line].col}"></div>
      <span class="mkind">＋ 개발</span>
      <div class="mtop">${MATIC[m.line][m.tier]}</div>
      ${n?`<span class="mmiss">🥲${n}</span>`:''}
      <div class="mbody">
        <div class="mnm">${m.name}</div>
        <div class="mtier">${LINE[m.line].n} · ${TIER_NAME[m.tier2]}</div>
        <div class="mpr">${G(m.price)}</div>
        <div class="mreq">${req.map(r=>{ const have=haveAt(r.k,r.g);
          return `<span class="mr1"><span>${MATIC[r.k][r.g]}</span>
            <span>${GRADE[r.g]} ${MAT[r.k][r.g]}</span>
            <b style="color:${have>=r.q?'var(--ok)':'#ff8f7a'}">${Math.min(have,r.q)}/${r.q}</b></span>`}).join('')}</div>
      </div>
      <button class="mbtn2 ${ok?'able':''}"
        onclick="${ok?`make('${m.id}');draw()`:`needInfo('${m.id}')`}">${ok?'개발':'재료 보기'}</button>
    </div>`});
  /* 메뉴 레벨 상한을 다 채운 요리는 여기서 '개선'한다. 개발과 같은 카드 문법 —
     둘 다 "재료를 써서 메뉴를 한 단계 올린다"는 같은 동작이라 화면을 나눌 이유가 없다 */
  const starable = starAll
    .filter(m=>!devF.length || devF.some(k=>usesLine(m,k)))
    .sort((a,b)=>(canStar(b)-canStar(a))||(a.tier2-b.tier2));
  const starCards = starable.map(m=>{
    const ok=canStar(m), st=mStar(m), req=starCost(m);
    return `<div class="mcard ${ok?'':'dim'}" data-mid="${m.id}" data-kind="star">
      <div class="mbar" style="background:${LINE[m.line].col}"></div>
      <span class="mkind up">✨ 개선</span>
      <div class="mtop">${MATIC[m.line][m.tier]}</div>
      <span class="mstar">${[0,1,2].map(i=>`<b class="${i<=st?'on':''}">★</b>`).join('')}</span>
      <div class="mbody">
        <div class="mnm">${m.name}</div>
        <div class="mtier">${STAR_NAME[st]} → <b style="color:var(--gold)">${STAR_NAME[st+1]}</b></div>
        <div class="mpr">${G(menuPrice(m))} → <b style="color:var(--ok)">${G(Math.round(menuPrice(m)/STAR_MUL[st]*STAR_MUL[st+1]))}</b></div>
        <div class="mreq">${req.map(r=>{ const have=haveAt(r.k,r.g);
          return `<span class="mr1"><span>${MATIC[r.k][r.g]}</span>
            <span>${GRADE[r.g]} ${MAT[r.k][r.g]}</span>
            <b style="color:${have>=r.q?'var(--ok)':'#ff8f7a'}">${Math.min(have,r.q)}/${r.q}</b></span>`}).join('')}</div>
      </div>
      <button class="mbtn2 ${ok?'able':''}"
        onclick="${ok?`upStar('${m.id}');draw()`:`starInfo('${m.id}')`}">${ok?'✨ 개선':'재료 보기'}</button>
    </div>`});
  const lockNext = MENU.filter(m=>!menuUnlocked(m)).sort((a,b)=>a.tier2-b.tier2)[0];
  /* 개발과 개선을 한 그리드에 섞는다. 섹션으로 가르면 홀수 개일 때 빈 슬롯이 생기고
     화면이 두 동강 난다 — 구분은 카드 좌상단 칩 하나로 충분하다.
     바로 할 수 있는 것(개선 가능 → 개발 가능) 순으로 앞에 세운다 */
  const all2 = [...starCards, ...cards].join('');
  return filt
    + (all2 ? `<div class="devgrid">${all2}</div>`
            : '<div class="card empty">지금 개발하거나 개선할 메뉴가 없습니다</div>')
    + (lockNext&&!devF.length ? teaser('🍳',lockNext.name,MENU_LV[lockNext.tier2],'') : '');
}

/* 탭마다 주 액션 하나. 자리는 항상 같고 버튼만 바뀐다 */
function renderCTA(){
  const box=$('botcta'); if(!box) return;
  const show = tab==='bag';
  document.body.classList.toggle('hascta', show);
  if(!show){ box.innerHTML=''; return }
  if(devOn){ box.innerHTML=''; document.body.classList.remove('hascta'); return }
  if(bagTab==='hunt'){
    const cur=Math.max(1,Math.min(50,S.huntPick||huntMax()||1)), open=huntOpen(cur);
    box.innerHTML=`<button class="mbtn hunt ${open?'':'off'}"
      onclick="${open?`hunt(${cur})`:'openHunt()'}">재료 구해오기</button>`;
  }else{
    const ready = MENU.filter(m=>!S.made[m.id]&&menuUnlocked(m)&&canMake(m)).length;
    box.innerHTML=`<button class="mbtn ${ready?'':'ghost'}" onclick="openDev()">
      <span>메뉴 개발</span>${ready?`<span class="cnt">${ready}</span>`:''}</button>`;
  }
}
/* 재료 계열 필터 — 비어 있으면 전체 */
let devF = [];
function toggleDevF(k){ const i=devF.indexOf(k); i<0?devF.push(k):devF.splice(i,1); draw() }
const usesLine = (m,k) => m.cost[k].some(q=>q>0);

   화면엔 등급·서빙·사냥이 뒤섞여 "이걸 올리면 뭐가 좋아지나"가 안 읽혔다.
   락은 '입장 가능 사냥터'로 통일하고, 재료 등급은 사냥터가 정한다 */

                 onclick="lvPet('${k}')">${lv>=PET_MAX?'MAX':G(c)}</button>`
             : petOn(k) ? `<button class="buy able" onclick="hirePet('${k}')">영입하기</button>`

        </div>

let dexTab='guest';

function openOdds(){

  /* 퍼즐 '펫 관리'와 같은 표를 그대로 쓴다. 두 화면이 다른 그림으로 같은 규칙을
     설명하면 플레이어는 둘 중 하나를 잘못 외운다.

/* 알 색 — 퍼즐의 tone() 과 같은 램프. 계열=색상, 단계=명도·채도 */
const EHUE={ b:[224,201], r:[6,24], g:[148,124], y:[36,52] };
const ESAT={ b:[58,100], r:[62,100], g:[52,82], y:[72,100] };
function eggTone(k,v){
  const t=Math.min(Math.max(v,1),14), p=(t-1)/13;
  const H=EHUE[k]||[212,212], A=ESAT[k]||[60,100];
  const hu=H[0]+(H[1]-H[0])*p, sa=A[0]+(A[1]-A[0])*p, li=30+41*p;
  const C=(l,ss)=>`hsl(${hu} ${Math.min(ss,100)}% ${Math.max(4,Math.min(96,l))}%)`;
  return `background:linear-gradient(180deg,${C(li+13,sa)} 0%,${C(li,sa)} 54%,${C(li-11,sa*.92)} 100%)`;
}
/* 퍼즐의 DIST_B 를 셸에서도 읽어야 확률표를 그린다 (같은 규칙을 한 번 더 적는다) */
const DIST_SHELL = [null,
  [.46,.30,.17,.07],[.36,.32,.23,.09],[.27,.32,.28,.13],
  [0,.44,.31,.19,.06],[0,.33,.32,.25,.10],[0,0,.42,.32,.19,.07],
  [0,0,0,.40,.31,.21,.08],[0,0,0,0,.38,.31,.22,.09],
  [0,0,0,0,0,.36,.31,.23,.10],[0,0,0,0,0,0,.34,.31,.24,.11]];
function distOfShell(lv){
  lv=Math.max(1,lv|0);
  if(lv<=10){ const a=DIST_SHELL[lv].slice(); while(a.length<10) a.push(0); return a }
  const t=lv-10;
  const shape=[Math.max(.26,.34-.015*t), .31, Math.min(.30,.24+.008*t), Math.min(.20,.11+.007*t)];
  const sum=shape.reduce((a,b)=>a+b,0);
  const out=new Array(lv).fill(0);
  shape.forEach((q,i)=>{ out[lv-4+i]=q/sum });
  return out;
}
const VNUM = v => Math.pow(2,v) >= 1e6 ? (Math.pow(2,v)/1e6>=1000?'2^'+v:(Math.pow(2,v)/1e6).toFixed(0)+'M') : Math.pow(2,v).toLocaleString();

/* ── 오프라인 보상 ── */
const OFF_MIN = 15*60*1000;                          // 15분 이상 비웠을 때만
function offReady(){ return Math.min((now()-(S.lastSeen||now())), idleCapH()*3600*1000) }
function offPct(){ return Math.min(1, offReady()/(idleCapH()*3600*1000)) }
function openOffline(force){
  const el = offReady();
